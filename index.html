<style>
:root{
  --bg:#0d0f12;--card:#171a1f;--card2:#1f242b;--line:#2a3039;--text:#eef1f5;--muted:#8d97a5;
  --accent:#ff7a1a;--accent2:#ff9a4d;--accentBg:rgba(255,122,26,.14);
  --green:#2fd27a;--greenBg:rgba(47,210,122,.13);--red:#ff5a5f;--redBg:rgba(255,90,95,.12);--blue:#4da3ff;
  --r:16px;--safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
  --navH:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--text)}
input[type=date]{color-scheme:dark}
header#top{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(var(--safeT) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.04);min-height:56px}
#topTitle{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topLeft:empty,#topRight:empty{display:none}
main#view{padding:12px 12px calc(var(--navH) + var(--safeB) + 24px)}
body.timerOn main#view{padding-bottom:calc(var(--navH) + var(--safeB) + 110px)}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(17,20,24,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safeB)}
nav#nav button{flex:1;height:var(--navH);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
nav#nav button svg{width:24px;height:24px}
nav#nav button.on{color:var(--accent)}
nav#nav .dot{position:absolute;margin:-18px 0 0 22px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.04)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}
h2{font-size:17px;margin:18px 4px 10px;font-weight:700;letter-spacing:-.01em}
h3{margin:0 0 12px;font-size:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--card2);font-weight:650;font-size:16px;border:1px solid var(--line);transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0d02}
.btn.green{background:var(--green);border-color:var(--green);color:#03170b}
.btn.danger{color:var(--red);background:var(--redBg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%;margin-bottom:10px}
.btn.big{min-height:58px;font-size:18px}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 11px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:650;color:var(--text);white-space:nowrap}
.chip.accent{background:var(--accentBg);border-color:transparent;color:var(--accent2)}
.chip.on{background:var(--accent);color:#1a0d02;border-color:var(--accent)}
.icon{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--card2);font-size:20px;font-weight:700;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted);margin-right:4px;text-transform:uppercase;letter-spacing:.03em}
.tag.or{background:var(--accentBg);color:var(--accent2)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
/* home */
.hero{background:linear-gradient(135deg,#2a1608 0%,#171a1f 70%);border:1px solid rgba(255,122,26,.25)}
.hero .big{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px}
.day{position:relative}
.day.isToday{border-color:rgba(255,122,26,.5);box-shadow:0 0 0 1px rgba(255,122,26,.25) inset}
.dayTag{width:46px;height:46px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.day.isToday .dayTag{background:var(--accent);color:#1a0d02}
.dayName{font-weight:750;font-size:17px}
.exList{margin:10px 0 12px;line-height:1.5}
.badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;color:var(--accent2);text-transform:uppercase;letter-spacing:.05em}
.hint{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted);margin-bottom:12px}
/* session */
.sessHead .titleBtn{display:block;width:100%;text-align:left;font-size:19px;font-weight:800;line-height:1.3;padding:0;letter-spacing:-.01em}
.sessMeta{margin-top:8px;gap:8px}
.sessMeta input[type=date]{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px;min-height:34px}
.progress{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;background:var(--green);border-radius:6px;transition:width .3s}
.ex{padding:12px 10px 10px}
.ex.complete{border-color:rgba(47,210,122,.35)}
.exHead{display:flex;align-items:flex-start;gap:8px}
.exNum{width:28px;height:28px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;margin-top:1px}
.ex.complete .exNum{background:var(--green);color:#03170b}
.exName{font-weight:750;font-size:17px;line-height:1.25}
.exTitle{display:flex;gap:9px;flex:1;min-width:0}
.last{margin:8px 2px 0;font-size:13.5px;color:var(--muted)}
.last b{color:var(--text);font-weight:650}
.sug{margin:8px 0 2px;display:flex;align-items:center;gap:8px;background:var(--accentBg);border-radius:11px;padding:8px 8px 8px 11px;font-size:13.5px}
.sug .t{flex:1;color:#ffd2b0}
.exNote{margin:8px 2px 0;font-size:13.5px;color:#c8d0da;background:var(--card2);border-radius:10px;padding:7px 10px}
.setsHead{display:grid;grid-template-columns:30px 1fr .84fr 48px;gap:6px;margin:12px 0 4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.set{display:grid;grid-template-columns:30px 1fr .84fr 48px;gap:6px;align-items:center;margin-bottom:6px;border-radius:13px;transition:background .2s}
.set.done{background:var(--greenBg)}
.setNo{height:48px;border-radius:11px;font-weight:800;color:var(--muted);font-size:15px;position:relative}
.setNo i{position:absolute;top:7px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.stepper{display:flex;align-items:center;background:var(--card2);border-radius:12px;height:48px;overflow:hidden;border:1px solid var(--line)}
.stepper button{width:38px;height:100%;font-size:22px;font-weight:600;color:var(--accent2);flex:none}
.stepper button:active{background:rgba(255,255,255,.07)}
.stepper input{flex:1;min-width:0;width:100%;height:100%;text-align:center;background:transparent;border:0;font-size:18px;font-weight:750;outline:none;padding:0}
.set.done .stepper{border-color:rgba(47,210,122,.3)}
.check{height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px;color:var(--muted);font-weight:900}
.set.done .check{background:var(--green);color:#03170b;border-color:var(--green)}
.setNote{font-size:12.5px;color:var(--accent2);margin:-2px 0 6px 40px}
.skipMsg{margin-top:10px;padding:10px 12px;border-radius:11px;background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ex.skipped{opacity:.75}
/* timer */
#timer{position:fixed;left:10px;right:10px;bottom:calc(var(--navH) + var(--safeB) + 8px);z-index:29;background:#1d2128;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateY(150%);transition:transform .25s}
#timer.show{transform:none}
#timer .tbar{height:5px;background:#2a3039}
#timer .tfill{height:100%;background:var(--accent);width:100%;transition:width .25s linear}
#timer .trow{display:flex;align-items:center;gap:8px;padding:9px 10px}
#timer .tval{flex:1;text-align:center;line-height:1.05}
#timer .tval small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
#timer .tval b{font-size:30px;font-variant-numeric:tabular-nums;font-weight:800}
#timer .tb{min-width:54px;height:46px;border-radius:12px;background:var(--card2);font-weight:750}
#timer.over{border-color:var(--green)}
#timer.over .tfill{background:var(--green)}
#timer.over .tval b{color:var(--green);font-size:22px}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end}
#sheetWrap[hidden]{display:none}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
#sheetWrap .sheet{position:relative;width:100%;max-height:88vh;overflow:auto;background:#181b21;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + var(--safeB));animation:up .22s ease-out;border-top:1px solid var(--line)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#3a414c;margin:0 auto 12px}
.sheet p{color:var(--muted);margin:0 0 16px}
.sheet .menu button{display:flex;width:100%;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-radius:12px;font-size:16.5px;font-weight:600;text-align:left}
.sheet .menu button:active{background:var(--card2)}
.sheet .menu button.red{color:var(--red)}
.sheet .menu .ic{width:26px;text-align:center;font-size:18px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.04em}
.inp{width:100%;min-height:48px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:80px;resize:vertical}
.plist{list-style:none;margin:0 0 12px;padding:0}
.plist li{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;background:var(--card2);border-radius:12px;margin-bottom:6px;min-height:52px}
.plist li .n{flex:1;font-weight:600}
.plist .icon{width:38px;height:38px;background:#272c34;font-size:17px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pick .chip{min-height:40px;font-size:14px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* history */
.hist{display:block;width:100%;text-align:left}
.hist .d{font-weight:750;font-size:16.5px}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.stats b{color:var(--text)}
.dEx{padding:12px 14px}
.dEx .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sets span{background:var(--card2);border-radius:9px;padding:5px 9px;font-weight:650;font-size:14.5px;font-variant-numeric:tabular-nums}
.sets span em{font-style:normal;color:var(--accent2);font-size:12px;margin-left:4px}
.delta{font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:7px}
.delta.up{color:var(--green);background:var(--greenBg)}.delta.down{color:var(--red);background:var(--redBg)}.delta.eq{color:var(--muted);background:var(--card2)}
/* progress */
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px;font-weight:650}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:14px;padding:12px;border:1px solid rgba(255,255,255,.04)}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--muted);font-weight:650}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:#323944;color:var(--text)}
svg.chart{width:100%;height:auto;display:block}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
/* weight */
.bwIn{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.bwIn .stepper{flex:1;height:60px}
.bwIn .stepper input{font-size:28px}
.bwIn .stepper button{width:52px;font-size:26px}
.wlist .wi{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.wlist .wi:last-child{border-bottom:0}
.inband{color:var(--green)}.outband{color:var(--accent2)}
.grip{color:#4a525e;font-size:15px;line-height:28px;margin:1px -3px 0 -4px;flex:none;-webkit-user-select:none;user-select:none}
[data-sort-item]{-webkit-touch-callout:none}
.exHead,.last,.sug .t,.exNote,.setsHead,.plist .n,.plist .grip{-webkit-user-select:none;user-select:none}
[data-sort-item].pressing{transform:scale(.985);transition:transform .25s ease}
.drag-ph{border:2px dashed rgba(255,122,26,.55);border-radius:var(--r);background:rgba(255,122,26,.06);list-style:none;box-sizing:border-box}
.plist .drag-ph{border-radius:12px}
.dragging{position:fixed;z-index:45;pointer-events:none;box-shadow:0 18px 40px rgba(0,0,0,.65),0 0 0 2px var(--accent);transform:scale(1.03);opacity:.97;transition:transform .15s ease,box-shadow .15s ease}
.plist li.dragging{background:#2a3039}
#exList.sorting .ex>:not(.exHead){display:none}
#exList.sorting .ex{padding:10px}
#exList.sorting .ex .exHead .chip,#exList.sorting .ex .exHead .icon{visibility:hidden}
body.dragActive{-webkit-user-select:none;user-select:none;cursor:grabbing}
#toast{position:fixed;left:50%;top:calc(var(--safeT) + 14px);transform:translate(-50%,-150%);background:#2b313a;color:var(--text);padding:11px 18px;border-radius:14px;font-weight:650;z-index:60;transition:transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.back{font-size:28px;line-height:1;width:40px;height:40px;margin-left:-8px;color:var(--accent2)}
</style>
</head>
<body>
<header id="top"><div id="topLeft"></div><div id="topTitle">Gym</div><div id="topRight"></div></header>
<main id="view"></main>
<div id="timer" aria-live="polite">
  <div class="tbar"><div class="tfill"></div></div>
  <div class="trow">
    <button class="tb" data-a="tAdj" data-v="-15">−15</button>

    <button class="tb" data-a="tAdj" data-v="15">+15</button>

  </div>
</div>
<nav id="nav">
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Training</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Verlauf</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Fortschritt</button>
  <button data-tab="bw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 9.5l1.5-2"/></svg>Gewicht</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Mehr</button>
</nav>

const $ = (s, r = document) => r.querySelector(s);

const isBW = (name, ex) => !!((ex && ex.bw != null) ? ex.bw : lib(name).bw);
const topW = sets => sets.length ? Math.max(...sets.map(s => +s.w || 0)) : 0;
const totalReps = sets => sum(sets.map(s => +s.r || 0));
const volume = sets => sum(sets.map(s => (+s.w || 0) * (+s.r || 0)));
const e1rm = sets => Math.max(0, ...sets.filter(s => s.r > 0 && s.r <= 15).map(s => s.w * (1 + s.r / 30)));
function wLabel(w, bw) {
  if (!bw) return fmtN(w);
  if (!w) return 'KG';
  return (w > 0 ? '+' : '−') + fmtN(Math.abs(w));
}
function setStr(s, bw) { return bw && !s.w ? `${s.r}` : `${wLabel(s.w, bw)}×${s.r}`; }
function setsStr(sets, bw) {
  if (bw && sets.every(s => !s.w)) return sets.map(s => s.r).join(' · ') + ' Wdh.';
  return sets.map(s => setStr(s, bw)).join(' · ') + (bw ? '' : ' kg');
}

/** Progressionsvorschlag */
function suggest(name, excludeId) {
  const perfs = performances(name, excludeId);
  if (!perfs.length) return null;
  const last = perfs[perfs.length - 1].ex.sets.filter(s => s.r > 0);
  if (!last.length) return null;
  const prev = perfs.length > 1 ? perfs[perfs.length - 2].ex.sets.filter(s => s.r > 0) : null;
  const bw = isBW(name, perfs[perfs.length - 1].ex);
  const inc = state.settings.inc || 2.5;
  const top = topW(last);
  const allHigh = last.every(s => s.r >= 12);
  let beat = false;
  if (prev && prev.length) {
    const topSets = last.filter(s => s.w === top);
    beat = top === topW(prev) && totalReps(last) > totalReps(prev) && Math.min(...topSets.map(s => s.r)) >= 10;
  }
  if (allHigh || beat) {
    const sets = last.map(s => ({ w: round(s.w + inc), r: Math.max(6, Math.min(s.r, 12) - 2) }));
    const why = allHigh ? 'alle Sätze ≥ 12 Wdh.' : 'mehr Wdh. als beim Mal davor';
    return { kind: 'weight', sets, why,
      text: `<b>+${fmtN(inc)} kg${bw ? ' Zusatz' : ''}</b> (${why}): ${setsStr(sets, bw)}` };
  }
  const sets = last.map(s => ({ w: s.w, r: s.r + 1 }));
  return { kind: 'reps', sets, why: 'gleiches Gewicht',
    text: `<b>+1 Wdh. pro Satz</b>: ${setsStr(sets, bw)}` };
}

  else if (L.base && L.base.length) sets = L.base.map(w => ({ w, r: L.bw && !w ? 8 : 10, done: false }));
  else sets = [0, 1, 2].map(() => ({ w: L.bw ? 0 : 20, r: 10, done: false }));
  return { id: uid(), name, sets, note: '', skipped: false };
}
function startSession(planId, names, title) {

/* ----- Training beenden ----- */
async function finishSession() {
  const a = state.active;
  document.querySelectorAll('.stepper input[data-in]').forEach(commitInput);
  const open = a.ex.filter(e => !e.skipped).reduce((n, e) => n + e.sets.filter(s => !s.done).length, 0);
  const done = a.ex.reduce((n, e) => n + e.sets.filter(s => s.done).length, 0);
  if (!done && !a.ex.some(e => e.skipped)) { toast('Hake zuerst mindestens einen Satz mit ✓ ab'); return; }
  if (open && !(await ask(a.editingId ? 'Speichern?' : 'Training beenden?', `${open} ${open === 1 ? 'Satz ist' : 'Sätze sind'} nicht abgehakt und ${open === 1 ? 'wird' : 'werden'} nicht gespeichert.`, a.editingId ? 'Speichern' : 'Beenden'))) return;
  const sess = {
    id: a.editingId || a.id, date: a.date || todayISO(), planId: a.planId, title: (a.title || '').trim() || 'Training',
    startedAt: a.startedAt, finishedAt: a.finishedAt || Date.now(),
    ex: a.ex.map(e => {
      const L = lib(e.name);
      const o = { name: e.name, sets: e.skipped ? [] : e.sets.filter(s => s.done).map(s => { const x = { w: +s.w || 0, r: +s.r || 0 }; if (s.note) x.note = s.note; return x; }) };
      if (L.bw) o.bw = true; if (L.perSide) o.perSide = true;
      if (e.note) o.note = e.note; if (e.skipped) o.skipped = true;
      return o;
    }).filter(e => e.skipped || e.sets.length),
  };
  const idx = state.sessions.findIndex(s => s.id === sess.id);
  if (idx >= 0) state.sessions[idx] = sess; else state.sessions.push(sess);
  state.active = null; save(); stopTimer(); releaseWakeLock();
  ui.tab = 'hist'; ui.histId = sess.id; render();
  toast(a.editingId ? 'Änderungen gespeichert' : 'Training gespeichert 💪');
}

/* ----- Verlauf ----- */
function sessStats(s) {
  const ex = s.ex.filter(e => !e.skipped);
  const sets = sum(ex.map(e => e.sets.length));
  const vol = sum(ex.filter(e => !e.bw).map(e => volume(e.sets)));
  const dur = s.finishedAt && s.startedAt ? Math.round((s.finishedAt - s.startedAt) / 60000) : null;
  return `<div class="stats"><span><b>${ex.length}</b> Übungen</span><span><b>${sets}</b> Sätze</span><span><b>${fmtN(vol / 1000, 1)}</b> t Volumen</span>${dur && dur < 600 ? `<span><b>${dur}</b> min</span>` : ''}</div>`;
}
function histCardInner(s) {

function viewHistory() {

}
function deltaBadge(cur, prev) {
  if (!prev) return '<span class="delta eq">Neu</span>';
  const dt = topW(cur) - topW(prev), dr = totalReps(cur) - totalReps(prev);
  if (dt > 0) return `<span class="delta up">+${fmtN(dt)} kg</span>`;
  if (dt < 0) return `<span class="delta down">−${fmtN(-dt)} kg</span>`;
  if (dr > 0) return `<span class="delta up">+${dr} Wdh.</span>`;

function setChip(x, bw) {

/* ----- Diagramme (inline SVG, keine externen Libs) ----- */
let chartN = 0;
function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(raw)); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function lineChart(points, opt = {}) {
  if (!points.length) return '<div class="empty">Noch keine Daten</div>';
  const { unit = '', band = null, color = '#ff7a1a', decimals = 1 } = opt;
  const W = 340, H = 200, L = 40, R = 14, T = 18, B = 26, id = 'g' + (++chartN);
  const xs = points.map(p => p.t);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 3 * 864e5; x1 += 3 * 864e5; }
  let ys = points.map(p => p.y); if (band) ys = ys.concat(band);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.18 || Math.max(1, Math.abs(y1) * 0.08);
  y0 -= pad; y1 += pad; if (Math.min(...ys) >= 0 && y0 < 0) y0 = 0;
  const step = niceStep((y1 - y0) / 4);
  y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  if (band) s += `<rect x="${L}" y="${Y(band[1])}" width="${W - L - R}" height="${Y(band[0]) - Y(band[1])}" fill="rgba(47,210,122,.13)"/>
    <text x="${L + 4}" y="${Y(band[1]) + 12}" fill="#2fd27a" font-size="10" font-weight="700">Ziel ${fmtN(band[0])}–${fmtN(band[1])} kg</text>`;
  for (let v = y0; v <= y1 + 1e-9; v += step) {
    s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a3039" stroke-width="1"/>
      <text x="${L - 6}" y="${Y(v) + 3.5}" fill="#8d97a5" font-size="10" text-anchor="end">${fmtN(v, 1)}</text>`;
  }
  const pts = points.map(p => [X(p.t), Y(p.y)]);
  const lineD = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  if (pts.length > 1) {
    s += `<path d="${lineD} L${pts[pts.length - 1][0].toFixed(1)} ${Y(y0)} L${pts[0][0].toFixed(1)} ${Y(y0)} Z" fill="url(#${id})"/>`;
    s += `<path d="${lineD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p, i) => { const l = i === pts.length - 1; s += `<circle cx="${p[0]}" cy="${p[1]}" r="${l ? 4.5 : 3.2}" fill="${l ? color : '#0d0f12'}" stroke="${color}" stroke-width="2"/>`; });
  const lp = pts[pts.length - 1], lv = points[points.length - 1].y;
  s += `<text x="${lp[0]}" y="${lp[1] - 10}" fill="#eef1f5" font-size="11.5" font-weight="800" text-anchor="${lp[0] > W - 60 ? 'end' : lp[0] < L + 30 ? 'start' : 'middle'}">${fmtN(lv, decimals)}${unit}</text>`;
  const idxs = [...new Set(points.length <= 3 ? points.map((_, i) => i) : [0, Math.floor((points.length - 1) / 2), points.length - 1])];
  idxs.forEach(i => { const x = X(points[i].t);
    s += `<text x="${x}" y="${H - 8}" fill="#8d97a5" font-size="10" text-anchor="${x < L + 20 ? 'start' : x > W - R - 20 ? 'end' : 'middle'}">${dm(isoOf(new Date(points[i].t)))}</text>`; });
  return s + `</svg>`;
}

/* ----- Fortschritt ----- */
function viewProgress() {
  setHeader('Fortschritt');
  const withHist = libNames().filter(n => performances(n).length);
  const without = libNames().filter(n => !withHist.includes(n));
  if (!ui.progEx || !state.lib[ui.progEx]) ui.progEx = withHist[0] || libNames()[0];
  const name = ui.progEx; const perfs = performances(name);
  const bw = !!lib(name).bw;
  let h = `<select class="inp" data-in="progEx" style="margin-bottom:12px" aria-label="Übung">
    ${withHist.length ? `<optgroup label="Mit Verlauf">${withHist.map(n => `<option ${n === name ? 'selected' : ''}>${esc(n)}</option>`).join('')}</optgroup>` : ''}
    ${without.length ? `<optgroup label="Noch ohne Daten">${without.map(n => `<option ${n === name ? 'selected' : ''}>${esc(n)}</option>`).join('')}</optgroup>` : ''}
  </select>`;
  if (!perfs.length) return h + `<div class="card empty">Für <b>${esc(name)}</b> gibt es noch keine Einträge.<br>Sobald du sie trainierst, siehst du hier deinen Verlauf.</div>`;
  const last = perfs[perfs.length - 1].ex.sets, first = perfs[0].ex.sets;
  const best = Math.max(...perfs.map(p => topW(p.ex.sets)));
  const bestReps = Math.max(...perfs.map(p => totalReps(p.ex.sets)));
  let since = '–';
  if (perfs.length > 1) {
    const dw = topW(last) - topW(first), dr = totalReps(last) - totalReps(first);
    since = dw ? `${dw > 0 ? '+' : '−'}${fmtN(Math.abs(dw))} <small>kg</small>` : `${dr >= 0 ? '+' : '−'}${Math.abs(dr)} <small>Wdh.</small>`;
  }
  h += `<div class="tiles">
    <div class="tile"><div class="k">${bw ? 'Max. Zusatz' : 'Bestes Gewicht'}</div><div class="v">${bw && !best ? 'KG' : fmtN(best) + ' <small>kg</small>'}</div></div>
    <div class="tile"><div class="k">Einheiten</div><div class="v">${perfs.length}</div></div>
    <div class="tile"><div class="k">${bw ? 'Max. Wdh. gesamt' : 'Geschätztes 1RM'}</div><div class="v">${bw ? bestReps : fmtN(Math.max(...perfs.map(p => e1rm(p.ex.sets))), 1) + ' <small>kg</small>'}</div></div>
    <div class="tile"><div class="k">Seit erstem Log</div><div class="v">${since}</div></div>
  </div>`;
  const sug = suggest(name);
  if (sug) h += `<div class="sug" style="margin:0 0 12px"><span class="t">💡 Nächstes Mal: ${sug.text}</span></div>`;
  const metrics = bw ? [['top', 'Zusatzgewicht'], ['reps', 'Wdh. gesamt']] : [['top', 'Top-Gewicht'], ['vol', 'Volumen'], ['reps', 'Wdh. gesamt']];
  if (!metrics.some(m => m[0] === ui.progMetric)) ui.progMetric = metrics[0][0];
  const pts = perfs.map(p => ({ t: parseISO(p.session.date).getTime() + Math.min(Math.max((p.session.finishedAt || 0) - parseISO(p.session.date).getTime(), 0), 864e5 - 1), y: ui.progMetric === 'top' ? topW(p.ex.sets) : ui.progMetric === 'vol' ? volume(p.ex.sets) : totalReps(p.ex.sets) }));
  h += `<div class="card"><div class="seg">${metrics.map(m => `<button class="${m[0] === ui.progMetric ? 'on' : ''}" data-a="progMetric" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>
    ${lineChart(pts, { unit: ui.progMetric === 'reps' ? '' : ' kg', decimals: ui.progMetric === 'vol' ? 0 : 1 })}
    <div class="tiny muted" style="margin-top:4px">${ui.progMetric === 'vol' ? 'Volumen = Summe Gewicht × Wdh. aller Sätze' : ui.progMetric === 'reps' ? 'Summe der Wiederholungen aller Sätze' : 'Schwerster Satz der Einheit'}${lib(name).perSide ? ' · Gewichte je Seite' : ''}</div></div>`;
  h += `<div class="card"><table class="tbl"><thead><tr><th>Datum</th><th>Sätze</th><th class="r">${bw ? 'Wdh.' : 'Vol.'}</th><th class="r">Δ</th></tr></thead><tbody>`;
  perfs.slice().reverse().forEach((p, i, arr) => {
    const prev = arr[i + 1];
    h += `<tr><td style="white-space:nowrap">${fmtDate(p.session.date)}</td><td>${p.ex.sets.map(s => setStr(s, bw)).join(' · ')}</td>
      <td class="r">${bw ? totalReps(p.ex.sets) : fmtN(volume(p.ex.sets), 0)}</td><td class="r">${deltaBadge(p.ex.sets, prev && prev.ex.sets)}</td></tr>`;
  });
  return h + `</tbody></table></div>`;
}

let bwDraft = null;
function viewBW() {
  setHeader('Körpergewicht');
  const list = state.bw.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const lastE = list[list.length - 1];
  const { bandLo: lo, bandHi: hi } = state.settings;
  if (!bwDraft) bwDraft = { date: todayISO(), kg: lastE ? lastE.kg : 87 };
  const cur = lastE ? lastE.kg : null;
  const status = cur == null ? '' : cur > hi ? `<span class="outband">${fmtN(cur - hi, 1)} kg über Ziel</span>` : cur < lo ? `<span class="outband">${fmtN(lo - cur, 1)} kg unter Ziel</span>` : `<span class="inband">Im Zielbereich ✓</span>`;
  const last7 = list.filter(e => parseISO(e.date) >= new Date(Date.now() - 7 * 864e5));
  let h = `<div class="card"><div class="muted small" style="font-weight:700">Neuer Eintrag</div>
    <div class="bwIn"><div class="stepper"><button data-a="bwAdj" data-v="-0.1" aria-label="minus">−</button><input id="bwKg" data-in="bwKg" inputmode="decimal" value="${fmtN(bwDraft.kg, 1)}" aria-label="Gewicht in kg"><button data-a="bwAdj" data-v="0.1" aria-label="plus">+</button></div></div>

  h += `<div class="tiles">

  h += `<div class="card">${lineChart(list.map(e => ({ t: parseISO(e.date).getTime(), y: e.kg })), { unit: ' kg', band: [lo, hi], color: '#4da3ff' })}</div>`;
  if (list.length) h += `<div class="card wlist">${list.slice().reverse().map(e => `<div class="wi"><span>${fmtDate(e.date, true)}</span><span class="row" style="gap:12px"><b class="${e.kg >= lo && e.kg <= hi ? 'inband' : ''}">${fmtN(e.kg, 1)} kg</b><button class="icon" style="width:34px;height:34px;font-size:15px;color:var(--muted)" data-a="bwDel" data-d="${e.date}" aria-label="löschen">✕</button></span></div>`).join('')}</div>`;
  return h;
}

/* ---------- Pausentimer ---------- */
// Zeitstempel-basiert: läuft korrekt weiter, auch wenn iOS die App im Hintergrund einfriert.
const T = { end: 0, total: 0, alerted: false, overAt: 0, body: '', ntfy: null, ntfyAt: 0 };
let audioCtx = null;
function unlockAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}
function beep() {
  if (!state.settings.sound || !audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    [0, 0.22, 0.44].forEach((d, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(); const t0 = audioCtx.currentTime + d;
      o.frequency.value = i === 2 ? 1320 : 880; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.2);
    });
  } catch (e) {}
}
function persistTimer() {
  try {
    T.end ? localStorage.setItem(KEY + '.timer', JSON.stringify({ end: T.end, total: T.total, body: T.body, ntfy: T.ntfy, ntfyAt: T.ntfyAt }))
          : localStorage.removeItem(KEY + '.timer');
  } catch (e) {}
}
function nextSetText(curEx) {
  const a = state.active; if (!a) return '';
  const i = Math.max(0, a.ex.indexOf(curEx));
  for (const e of a.ex.slice(i).concat(a.ex.slice(0, i))) {
    if (e.skipped) continue;
    const k = e.sets.findIndex(s => !s.done);
    if (k >= 0) { const s = e.sets[k], bw = !!lib(e.name).bw; return `Weiter: ${e.name} · Satz ${k + 1} (${bw && !s.w ? s.r + ' Wdh.' : wLabel(s.w, bw) + ' kg × ' + s.r})`; }
  }
  return 'Alle Sätze erledigt – Training beenden?';
}
function startTimer(sec, body) {
  T.total = sec; T.end = Date.now() + sec * 1000; T.alerted = false; T.body = body || T.body || 'Weiter geht’s!';
  $('#timer').classList.add('show'); $('#timer').classList.remove('over'); document.body.classList.add('timerOn');
  persistTimer(); ntfySchedule(); tickTimer();
}
function stopTimer() {
  ntfyCancel();
  T.end = 0; persistTimer(); $('#timer').classList.remove('show', 'over'); document.body.classList.remove('timerOn');
}
function timerDue(lateMs) {
  T.alerted = true; T.overAt = Date.now();
  const el = $('#timer');
  el.classList.add('over'); el.querySelector('.tfill').style.width = '100%';
  $('#tTime').textContent = 'Los geht’s! 💪';
  $('#tLabel').textContent = lateMs > 5000 ? `Pause vorbei · seit ${mmss(lateMs / 1000)}` : 'Pause vorbei';
  if (state.settings.vibrate && navigator.vibrate && !(navigator.userActivation && !navigator.userActivation.hasBeenActive)) { try { navigator.vibrate([300, 120, 300, 120, 500]); } catch (e) {} }
  beep();
  // Mitteilung: nicht doppelt, wenn ntfy sie im Hintergrund schon zugestellt hat
  const ntfyDelivered = T.ntfy === 'scheduled' && Date.now() >= T.ntfyAt;
  if (!ntfyDelivered) showRestNotification(T.body);
  persistTimer();
}
function tickTimer() {
  if (!T.end) return;
  const now = Date.now(), rem = (T.end - now) / 1000;
  const el = $('#timer');
  if (rem > 0) {
    $('#tTime').textContent = mmss(rem); $('#tLabel').textContent = 'Pause';
    el.querySelector('.tfill').style.width = Math.max(0, Math.min(100, rem / T.total * 100)) + '%';
    // App ist offen: lokale Mitteilung reicht → geplante ntfy-Mitteilung kurz vorher stornieren (keine Doppelung)
    if (rem <= 2.5 && T.ntfy === 'scheduled' && document.visibilityState === 'visible') ntfyCancel();

}
function restoreTimer() {
  try {
    const t = JSON.parse(localStorage.getItem(KEY + '.timer') || 'null');
    if (!t || !state.active) { localStorage.removeItem(KEY + '.timer'); return; }
    Object.assign(T, { end: t.end, total: t.total, body: t.body || '', ntfy: t.ntfy || null, ntfyAt: t.ntfyAt || 0, alerted: false });
    if (t.end > Date.now() || Date.now() - t.end < 10 * 60000) {   // läuft noch oder ist erst kürzlich abgelaufen (App wurde neu geladen)
      $('#timer').classList.add('show'); document.body.classList.add('timerOn'); tickTimer();
    } else { T.end = 0; localStorage.removeItem(KEY + '.timer'); }
  } catch (e) {}
}
setInterval(() => { tickTimer(); tickElapsed(); }, 250);

/* ---------- Mitteilungen (Notification API über Service Worker) ---------- */
const isStandalone = () => navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const notifSupported = () => 'Notification' in window;
const notifPerm = () => notifSupported() ? Notification.permission : 'unsupported';
async function askNotifPermission() {
  state.settings.notifAsked = true; save();
  if (!notifSupported()) {
    toast(isIOS() && !isStandalone() ? 'Nur in der App vom Home-Bildschirm möglich' : 'Mitteilungen werden hier nicht unterstützt');
    return 'unsupported';
  }
  let p;
  try { p = await Notification.requestPermission(); } catch (e) { p = Notification.permission; }
  if (p === 'granted') { state.settings.notify = true; save(); toast('Mitteilungen aktiviert ✓'); }
  else if (p === 'denied') toast('Mitteilungen blockiert – in den iPhone-Einstellungen änderbar');
  return p;
}
async function showRestNotification(body, title = 'Pause vorbei 💪') {
  if (!state.settings.notify || notifPerm() !== 'granted') return false;
  const opts = { body: body || 'Weiter geht’s!', tag: 'gym-rest', renotify: true, silent: false, vibrate: [300, 120, 300], data: { url: location.href.split('#')[0] } };
  try {
    if ('serviceWorker' in navigator) {
      const reg = await Promise.race([navigator.serviceWorker.getRegistration(), new Promise(r => setTimeout(() => r(null), 1500))]);
      if (reg && reg.showNotification) { await reg.showNotification(title, opts); return true; }
    }
  } catch (e) {}
  try { new Notification(title, opts); return true; } catch (e) { return false; }   // Fallback (z. B. ohne Service Worker)
}

/* ---------- Optional: echte Hintergrund-Mitteilung über ntfy.sh (kein Konto, Thema = Zufallsgeheimnis auf dem Gerät) ---------- */
const NTFY = 'https://ntfy.sh';
const hdrEnc = s => /^[\x20-\x7e]*$/.test(s) ? s : '=?UTF-8?B?' + btoa(String.fromCharCode(...new TextEncoder().encode(s))) + '?=';
function newTopic() { const a = new Uint8Array(15); crypto.getRandomValues(a); return 'gym-' + [...a].map(b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); }
function ntfyPost(path, body, headers) {
  return fetch(`${NTFY}/${state.settings.ntfyTopic}${path}`, { method: 'POST', body, headers, keepalive: true });
}
async function ntfySchedule() {
  const S = state.settings;
  if (!S.ntfy || !S.ntfyTopic || !T.end) return;
  const secs = Math.round((T.end - Date.now()) / 1000);
  if (secs < 11) { ntfyCancel(); return; }                      // ntfy.sh: Mindestverzögerung 10 s
  const at = T.end;
  T.ntfy = 'pending'; T.ntfyAt = at; persistTimer();
  try {
    // gleiche Sequenz-ID "rest" → ersetzt eine noch nicht zugestellte, vorher geplante Mitteilung
    const r = await ntfyPost('/rest', T.body || 'Weiter geht’s!', { 'X-Delay': secs + 's', 'X-Title': hdrEnc('Pause vorbei 💪'), 'X-Tags': 'stopwatch', 'X-Priority': '4' });
    if (T.ntfyAt === at && T.ntfy === 'pending') T.ntfy = r.ok ? 'scheduled' : 'error';
  } catch (e) { if (T.ntfyAt === at) T.ntfy = 'error'; }
  persistTimer();
}
function ntfyCancel() {
  const S = state.settings;
  // nur stornieren, solange sie noch nicht zugestellt wurde (DELETE danach würde die zugestellte Mitteilung entfernen)
  if (!T.ntfy || T.ntfy === 'cancelled' || !S.ntfyTopic || Date.now() > T.ntfyAt - 500) return;
  T.ntfy = 'cancelled'; persistTimer();
  try { fetch(`${NTFY}/${S.ntfyTopic}/rest`, { method: 'DELETE', keepalive: true }).catch(() => {}); } catch (e) {}
}

let wakeLock = null;
async function requestWakeLock() {
  if (!state.settings.wakeLock || !state.active || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;

}

    sug.sets.forEach((s, k) => { if (!ex.sets[k]) ex.sets[k] = { w: s.w, r: s.r, done: false }; else if (!ex.sets[k].done) { ex.sets[k].w = s.w; ex.sets[k].r = s.r; } });
    save(); rerenderCard(ex); toast('Vorschlag übernommen');
  },
  openSess: el => { ui.histId = el.dataset.id; render(); },
  histBack: () => { ui.histId = null; render(); },
  delSess: async el => { if (!(await ask('Training löschen?', 'Das kann nicht rückgängig gemacht werden (außer per Backup).', 'Löschen', true))) return; state.sessions = state.sessions.filter(s => s.id !== el.dataset.id); ui.histId = null; save(); render(); toast('Training gelöscht'); },
  repeatSess: async el => {
    const s = state.sessions.find(x => x.id === el.dataset.id); if (!(await confirmReplace())) return;
    const plan = state.plans.find(p => p.id === s.planId);
    startSession(s.planId, s.ex.map(e => e.name), plan ? `${plan.day} · ${plan.title}` : s.title);
  },
  editSess: el => {
    if (state.active) { toast('Beende zuerst das laufende Training'); return; }
    const s = clone(state.sessions.find(x => x.id === el.dataset.id));
    state.active = { ...s, editingId: s.id, ex: s.ex.map(e => ({ ...e, id: uid(), note: e.note || '', skipped: !!e.skipped, sets: e.sets.map(x => ({ ...x, done: true })) })) };
    save(); ui.tab = 'train'; render();
  },
  progMetric: el => { ui.progMetric = el.dataset.m; render(true); },
  bwAdj: el => { const inp = $('#bwKg'); const v = (parseN(inp.value) ?? bwDraft.kg) + +el.dataset.v; bwDraft.kg = round(Math.max(30, Math.min(250, v)), 1); inp.value = fmtN(bwDraft.kg, 1); },
  bwSave: () => {
    const v = parseN($('#bwKg').value); if (v == null || v < 30 || v > 250) { toast('Bitte gültiges Gewicht eingeben'); return; }
    const d = bwDraft.date || todayISO(); state.bw = state.bw.filter(e => e.date !== d); state.bw.push({ date: d, kg: round(v, 1) });
    save(); bwDraft = { date: todayISO(), kg: round(v, 1) }; render(true); toast(`${fmtN(v, 1)} kg gespeichert`);
  },
  bwDel: async el => { if (!(await ask('Eintrag löschen?', `Gewicht vom ${fmtDate(el.dataset.d, true)}`, 'Löschen', true))) return; state.bw = state.bw.filter(e => e.date !== el.dataset.d); save(); render(true); },
  setInc: el => { state.settings.inc = +el.dataset.v; save(); render(true); },
  export: () => doExport(), shareExport: () => doShare(),
  import: () => { const f = $('#fileIn'); f.value = ''; f.click(); },
  resetPlans: async () => { if (!(await ask('Pläne zurücksetzen?', 'Die 4 Trainingstage bekommen wieder die Standard-Übungen. Dein Verlauf bleibt erhalten.', 'Zurücksetzen', true))) return; state.plans = clone(DEFAULT_PLANS); for (const k in DEFAULT_LIB) if (!state.lib[k]) state.lib[k] = clone(DEFAULT_LIB[k]); save(); render(true); toast('Pläne zurückgesetzt'); },
  wipe: async () => {
    if (!(await ask('Alle Daten löschen?', 'Alle Trainings, Gewichte und Pläne werden gelöscht. Exportiere vorher ein Backup!', 'Alles löschen', true))) return;
    state = defaultState(); state.sessions = []; state.bw = []; save(); stopTimer(); ui.histId = null; render(); toast('Alle Daten gelöscht');
  },
};
function keepPlanTitle() { const t = $('#pTitle'); if (t && planDraft) planDraft.title = t.value.trim() || planDraft.title; }
function moveEx(id, d) {
  const a = state.active.ex, i = a.findIndex(e => e.id === id), j = i + d;
  if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save(); closeSheet(); render(true);
  setTimeout(() => { const el = $('#ex-' + id); el && el.scrollIntoView({ block: 'center' }); }, 30);
}
function adjust(el, dir) {
  const { ex, set, row } = ctx(el); const f = el.dataset.f; const L = lib(ex.name);
  const inp = row.querySelector(`[data-in=${f}]`); commitInput(inp);
  if (f === 'w') set.w = round(Math.max(L.bw ? -100 : 0, (+set.w || 0) + dir * (L.step || DEFAULT_STEP)));
  else set.r = Math.max(0, (+set.r || 0) + dir);
  inp.value = f === 'w' ? fmtN(set.w) : set.r; save();
}
function commitInput(inp) {
  if (!inp || !inp.dataset || !/^[wr]$/.test(inp.dataset.in || '')) return;
  const { ex, set } = ctx(inp); if (!set) return;
  const v = parseN(inp.value);
  if (inp.dataset.in === 'w') { if (v != null) set.w = round(Math.max(lib(ex.name).bw ? -100 : 0, v)); inp.value = fmtN(set.w); }
  else { if (v != null) set.r = Math.max(0, Math.round(v)); inp.value = set.r; }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('#nav [data-tab]');
  if (tab) {
    const same = ui.tab === tab.dataset.tab; ui.tab = tab.dataset.tab;
    if (ui.tab === 'hist' && same) ui.histId = null;
    if (ui.tab === 'bw') bwDraft = null;
    render(); return;
  }
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'w' || k === 'r') { commitInput(el); save(); }
  else if (k === 'sessTitle') { state.active.title = el.value; save(); }
  else if (k === 'sessDate') { if (el.value) state.active.date = el.value; save(); }
  else if (k === 'progEx') { ui.progEx = el.value; render(true); }
  else if (k === 'bwDate') { bwDraft.date = el.value; }
  else if (k === 'bwKg') { const v = parseN(el.value); if (v != null) bwDraft.kg = v; }
  else if (k === 'bandLo' || k === 'bandHi') {
    const v = parseN(el.value); const S = state.settings;
    if (v != null) { S[k] = v; if (S.bandLo > S.bandHi) [S.bandLo, S.bandHi] = [S.bandHi, S.bandLo]; save(); }
    render(true);
  }
  else if (k.startsWith('set_')) { state.settings[k.slice(4)] = el.checked; save(); if (k === 'set_wakeLock') el.checked ? requestWakeLock() : releaseWakeLock(); if (k === 'set_ntfy') { if (el.checked) ntfySchedule(); else ntfyCancel(); } }
});
document.addEventListener('focusin', e => { if (e.target.matches('.stepper input:not([readonly])')) setTimeout(() => { try { e.target.select(); } catch (_) {} }, 0); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.matches('.stepper input')) t.blur();
  else if (t.id === 'axNew') A.axAddNew();
  else if (t.id === 'pNew') A.pAddNew();
  else if (t.id === 'askIn' && t.tagName === 'INPUT') A.sheetOk();
});
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  importText(await f.text());
});
window.addEventListener('storage', e => { if (e.key === KEY) { load(); render(true); } });

/* ---------- PWA: Manifest + Offline ---------- */
(function pwa() {
  try {
    const base = location.href.split('#')[0].split('?')[0];
    const manifest = { name: 'Gym Tracker', short_name: 'Gym', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone',
      background_color: '#0d0f12', theme_color: '#0d0f12', lang: 'de',
      icons: [{ src: ICON, sizes: '180x180', type: 'image/png', purpose: 'any' }] };
    const link = document.createElement('link'); link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  } catch (e) {}
  // Optionaler Service Worker (sw.js neben index.html): macht die App beim Hosting voll offline-fähig.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    let hadController = !!navigator.serviceWorker.controller, pendingReload = false;
    const reloadNow = () => { if (!window.__gymReloading) { window.__gymReloading = true; persistTimer(); location.reload(); } };
    // Neue Version aktiv → neu laden (Daten liegen in localStorage, nichts geht verloren)
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) { hadController = true; return; }
      const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if (typing || !$('#sheetWrap').hidden) pendingReload = true; else reloadNow();
    });
    document.addEventListener('visibilitychange', () => { if (pendingReload && document.visibilityState === 'hidden') reloadNow(); });
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {}));
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();

/* ---------- Start ---------- */
load();
if (state.active) ui.tab = 'train';
render();
restoreTimer();
requestWakeLock();
window.__gym = { get state() { return state; }, ui, suggest, performances, T, startTimer, nextSetText };

/* ---------- Sortieren per Gedrückthalten & Ziehen (Touch + Maus) ---------- */
// Gilt für alle Listen mit [data-sort-list] und Einträgen [data-sort-item]:
//  - "session": Übungen im laufenden Training  - "plan": Übungen im Trainingstag-Editor
// Normales Scrollen bleibt unberührt: Erst nach ~380 ms ruhigem Halten wird gezogen,
// wer vorher den Finger bewegt (> 10 px), scrollt ganz normal.
const DRAG = { t: null, pressT: null, item: null, list: null, active: false, ph: null, x: 0, y: 0, sx: 0, sy: 0, dy: 0, from: -1, raf: 0, lastTouch: 0, suppressUntil: 0, scroller: null };
const DRAG_DELAY = 380, DRAG_SLOP = 10;
const DRAG_NOSTART = 'input,textarea,select,button,a,label,.stepper,.check';

const dragItems = list => [...list.children].filter(el => el.hasAttribute('data-sort-item'));
function dragScroller(list) { return list.closest('.sheet') || null; }   // null = Fenster
function dragScrollBy(sc, dy) { if (!dy) return; if (sc) sc.scrollTop += dy; else window.scrollBy(0, dy); }
function dragBounds(sc) {
  if (sc) { const r = sc.getBoundingClientRect(); return { top: r.top + 60, bottom: r.bottom - 60 }; }
  const head = $('#top').getBoundingClientRect().bottom, nav = $('#nav').getBoundingClientRect().top;
  return { top: head + 60, bottom: nav - 60 };
}

function dragStart(target, x, y, input) {
  if (DRAG.active) return;
  dragCancelPress();
  const item = target && target.closest && target.closest('[data-sort-item]');
  if (!item || target.closest(DRAG_NOSTART)) return;
  const list = item.closest('[data-sort-list]'); if (!list || dragItems(list).length < 2) return;
  Object.assign(DRAG, { item, list, sx: x, sy: y, x, y, input });
  DRAG.pressT = setTimeout(() => item.classList.add('pressing'), 140);
  DRAG.t = setTimeout(dragActivate, DRAG_DELAY);
}
function dragCancelPress() {
  clearTimeout(DRAG.t); clearTimeout(DRAG.pressT); DRAG.t = DRAG.pressT = null;
  if (DRAG.item && !DRAG.active) { DRAG.item.classList.remove('pressing'); DRAG.item = null; DRAG.input = null; }
}
function dragActivate() {
  DRAG.t = null;
  const { item, list } = DRAG;
  if (!item || !item.isConnected) { dragCancelPress(); return; }
  item.classList.remove('pressing');
  DRAG.active = true; DRAG.suppressUntil = Infinity;
  try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  try { window.getSelection && window.getSelection().removeAllRanges(); } catch (e) {}
  DRAG.from = dragItems(list).indexOf(item);
  DRAG.scroller = dragScroller(list);
  list.classList.add('sorting'); document.body.classList.add('dragActive');
  // Kompaktansicht: gezogenen Eintrag unter den Finger scrollen
  let r = item.getBoundingClientRect();
  dragScrollBy(DRAG.scroller, Math.round(r.top + r.height / 2 - DRAG.y));
  r = item.getBoundingClientRect();
  const ph = document.createElement(item.tagName === 'LI' ? 'li' : 'div');
  ph.className = 'drag-ph'; ph.style.height = r.height + 'px'; ph.style.marginBottom = getComputedStyle(item).marginBottom;
  list.insertBefore(ph, item);
  DRAG.ph = ph; DRAG.dy = Math.min(Math.max(DRAG.y - r.top, 10), r.height - 10);
  Object.assign(item.style, { position: 'fixed', left: r.left + 'px', top: (DRAG.y - DRAG.dy) + 'px', width: r.width + 'px', height: r.height + 'px', margin: '0' });
  item.classList.add('dragging');
  dragLoop();
}
function dragMove(x, y) {
  DRAG.x = x; DRAG.y = y;
  if (!DRAG.active) {
    if (DRAG.t && Math.hypot(x - DRAG.sx, y - DRAG.sy) > DRAG_SLOP) dragCancelPress();   // = Scrollen
    return;
  }
  DRAG.item.style.top = (y - DRAG.dy) + 'px';
  dragReorder();
}
function dragReorder() {
  const { list, ph, item, y } = DRAG;
  const others = dragItems(list).filter(el => el !== item);
  let before = null;
  for (const el of others) { const r = el.getBoundingClientRect(); if (y < r.top + r.height / 2) { before = el; break; } }
  let next = ph.nextElementSibling; if (next === item) next = next.nextElementSibling;
  if (next !== before) list.insertBefore(ph, before);   // before = null → ans Ende
}
function dragLoop() {
  if (!DRAG.active) return;
  const b = dragBounds(DRAG.scroller); let v = 0;
  if (DRAG.y < b.top) v = -Math.min(16, (b.top - DRAG.y) / 3 + 2);
  else if (DRAG.y > b.bottom) v = Math.min(16, (DRAG.y - b.bottom) / 3 + 2);
  if (v) { dragScrollBy(DRAG.scroller, Math.round(v)); dragReorder(); }
  DRAG.raf = requestAnimationFrame(dragLoop);
}
function dragEnd() {
  if (!DRAG.active) { dragCancelPress(); return; }
  cancelAnimationFrame(DRAG.raf);
  const { item, ph, list, from } = DRAG;
  const keepTop = item.getBoundingClientRect().top;
  ph.replaceWith(item);
  item.removeAttribute('style'); item.classList.remove('dragging');
  list.classList.remove('sorting'); document.body.classList.remove('dragActive');
  DRAG.active = false; DRAG.item = null; DRAG.ph = null; DRAG.input = null;
  DRAG.suppressUntil = Date.now() + 400; DRAG.suppressOnce = true;   // nur den einen Klick, den das Loslassen evtl. erzeugt
  const to = dragItems(list).indexOf(item);
  onSortDrop(list.dataset.sortList, list, item, from, to, keepTop);
}
function onSortDrop(kind, list, item, from, to, keepTop) {
  if (kind === 'session' && state.active) {
    if (from !== to) {
      const ids = dragItems(list).map(el => el.dataset.ex);
      state.active.ex.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      toast(`${findEx(item.dataset.ex).name} verschoben`);
    }
    state.settings.dragHintSeen = true; save();
    render(true);
    const el = $('#ex-' + item.dataset.ex);
    if (el) window.scrollBy(0, el.getBoundingClientRect().top - Math.max(keepTop, $('#top').getBoundingClientRect().bottom + 8));
  } else if (kind === 'plan' && planDraft) {
    keepPlanTitle();
    planDraft.ex = dragItems(list).map(li => li.dataset.n);
    const sc = $('#sheet'), st = sc.scrollTop; refreshSheet(); sc.scrollTop = st;
  }
}

// Touch (iPhone): touchmove muss nicht-passiv sein, damit preventDefault() das Scrollen während des Ziehens stoppt.
document.addEventListener('touchstart', e => {
  DRAG.lastTouch = Date.now();
  if (e.touches.length !== 1) { if (DRAG.active) dragEnd(); else dragCancelPress(); return; }
  const t = e.touches[0]; dragStart(e.target, t.clientX, t.clientY, 'touch');
}, { passive: true });
document.addEventListener('touchmove', e => {
  const t = e.touches[0]; if (!t) return;
  if (DRAG.input !== 'touch') return;
  if (DRAG.active) { e.preventDefault(); dragMove(t.clientX, t.clientY); }
  else if (DRAG.t) dragMove(t.clientX, t.clientY);
}, { passive: false });
document.addEventListener('touchend', e => { DRAG.lastTouch = Date.now(); if (DRAG.input !== 'touch') return; if (DRAG.active && e.cancelable) e.preventDefault(); dragEnd(); }, { passive: false });
document.addEventListener('touchcancel', () => { if (DRAG.input === 'touch') dragEnd(); });
// Maus (Desktop) – emulierte Mausereignisse nach Touch ignorieren
document.addEventListener('mousedown', e => { if (e.button === 0 && !DRAG.active && Date.now() - DRAG.lastTouch > 1000) dragStart(e.target, e.clientX, e.clientY, 'mouse'); });
document.addEventListener('mousemove', e => { if (DRAG.input !== 'mouse') return; if (DRAG.active) e.preventDefault(); if (DRAG.active || DRAG.t) dragMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', () => { if (DRAG.input === 'mouse') dragEnd(); });
// Nach dem Ablegen keinen versehentlichen Klick auslösen; kein Kontextmenü/Textauswahl beim Halten
document.addEventListener('click', e => {
  if (DRAG.active || (DRAG.suppressOnce && Date.now() < DRAG.suppressUntil)) { DRAG.suppressOnce = false; e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener('contextmenu', e => { if (DRAG.t || DRAG.active) e.preventDefault(); });
document.addEventListener('selectstart', e => { if (DRAG.t || DRAG.active) e.preventDefault(); });
window.addEventListener('blur', () => { if (DRAG.active) dragEnd(); else dragCancelPress(); });

</script>
