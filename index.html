:root{
  /* Nico Branding: Blacklight-Neon */
  --bg:#050409;--surface:#0C0A14;--surface2:#14111F;--line:#1F1A33;--line2:#2A2442;
  --text:#EDEAFF;--muted:#9A93C0;--text2:#C9C3E6;
  --blue:#3D7BFF;--purple:#8B5CF6;--neon:#B44CFF;--cyan:#22D3EE;
  --success:#34D399;--warning:#FBBF24;--error:#F43F5E;
  --grad:linear-gradient(135deg,#3D7BFF 0%,#8B5CF6 55%,#B44CFF 100%);
  --glow:0 0 24px rgba(180,76,255,.35);--tglow:0 0 12px rgba(139,92,246,.6);--shadow:0 8px 32px rgba(0,0,0,.45);
  --fHead:"Playfair Display",Georgia,"Times New Roman",serif;
  --fUI:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* Aliase (vom JS genutzt) */
  --card:var(--surface);--card2:var(--surface2);
  --accent:var(--blue);--accent2:#7AA3FF;--accentBg:rgba(61,123,255,.12);
  --green:var(--success);--greenBg:rgba(52,211,153,.10);--red:var(--error);--redBg:rgba(244,63,94,.12);
  --r:16px;--rb:10px;--safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
  --navH:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--fUI);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--text)}
input[type=date]{color-scheme:dark}
b,strong{font-weight:650}
.num,input[inputmode],.sets span,.tbl,.stats,.dayTag,.exNum,.setNo{font-variant-numeric:tabular-nums}
header#top{position:sticky;top:0;z-index:20;background:rgba(5,4,9,.86);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  padding:calc(var(--safeT) + 10px) 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);min-height:60px}
header#top::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:1px;background:var(--grad);opacity:.45}
#topTitle{font-family:var(--fHead);font-style:italic;font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.15;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2px}
#topLeft:empty,#topRight:empty{display:none}
main#view{padding:16px 16px calc(var(--navH) + var(--safeB) + 24px)}
body.timerOn main#view{padding-bottom:calc(var(--navH) + var(--safeB) + 112px)}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(12,10,20,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:var(--safeB)}
nav#nav button{position:relative;flex:1;height:var(--navH);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
nav#nav button svg{width:24px;height:24px}
nav#nav button.on{color:var(--text)}
nav#nav button.on svg{color:var(--neon);filter:drop-shadow(0 0 6px rgba(180,76,255,.55))}
nav#nav button.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--grad);box-shadow:var(--glow)}
nav#nav .dot{position:absolute;margin:-18px 0 0 22px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.7)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:16px;border:1px solid var(--line)}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}
h2{font-family:var(--fHead);font-size:21px;margin:24px 4px 12px;font-weight:700;letter-spacing:0;line-height:1.25}
h3{font-family:var(--fHead);margin:0 0 12px;font-size:23px;font-weight:700;font-style:italic;line-height:1.25}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--rb);background:var(--card2);font-weight:600;font-size:16px;border:1px solid var(--line2);transition:transform .08s,opacity .15s,box-shadow .2s}
.btn:active{transform:scale(.97);opacity:.88}
.btn.primary{background:var(--blue);border-color:#5B8FFF;color:#fff;box-shadow:0 4px 18px rgba(61,123,255,.28)}
.btn.primary:active{box-shadow:var(--glow)}
.btn.green{background:var(--success);border-color:var(--success);color:#04140D}
.btn.danger{color:#FF7A93;background:var(--redBg);border-color:rgba(244,63,94,.25)}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%;margin-bottom:8px}
.btn.big{min-height:56px;font-size:17px}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:var(--rb)}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px;border-radius:var(--rb);background:var(--card2);border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.accent{background:var(--accentBg);border-color:rgba(61,123,255,.3);color:var(--accent2)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.icon{width:44px;height:44px;border-radius:var(--rb);display:inline-flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--line);font-size:20px;font-weight:600;flex:none;color:var(--text2)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--muted);margin-right:4px;text-transform:uppercase;letter-spacing:.08em}
.tag.or{background:rgba(180,76,255,.10);border-color:rgba(180,76,255,.3);color:#D9A8FF}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
/* home */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,rgba(139,92,246,.10) 0%,rgba(12,10,20,0) 60%),var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--grad);box-shadow:var(--glow)}
.hero .big:not(.btn){font-family:var(--fHead);font-style:italic;font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:4px 0 8px}
.day{position:relative}
.day.isToday{border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;box-shadow:var(--glow)}
.dayTag{width:48px;height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none;color:var(--text2)}
.day.isToday .dayTag{background:var(--grad);border-color:transparent;color:#fff}
.dayName{font-family:var(--fHead);font-weight:700;font-size:21px;line-height:1.2}
.exList{margin:8px 0 16px;line-height:1.55;color:var(--text2)}
.badge{position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;color:var(--neon);text-transform:uppercase;letter-spacing:.08em;text-shadow:0 0 10px rgba(180,76,255,.55)}
.hint{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--muted);margin-bottom:16px}
/* session */
.sessHead .titleBtn{display:block;width:100%;text-align:left;font-family:var(--fHead);font-style:italic;font-size:22px;font-weight:700;line-height:1.3;padding:0}
.sessMeta{margin-top:8px;gap:8px}
.sessMeta input[type=date]{background:var(--card2);border:1px solid var(--line2);border-radius:var(--rb);padding:6px 8px;font-size:14px;min-height:36px}
.progress{height:4px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:16px}
.progress>div{height:100%;background:var(--grad);border-radius:4px;transition:width .3s;box-shadow:0 0 10px rgba(180,76,255,.5)}
.ex{padding:16px 12px 12px}
.ex.complete{border-color:rgba(52,211,153,.35)}
.exHead{display:flex;align-items:flex-start;gap:8px}
.exNum{width:30px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;margin-top:1px;color:var(--muted)}
.ex.complete .exNum{background:var(--success);border-color:var(--success);color:#04140D}
.exName{font-weight:650;font-size:17px;line-height:1.3;letter-spacing:-.005em}
.exTitle{display:flex;gap:8px;flex:1;min-width:0}
.last{margin:8px 2px 0;font-size:14px;color:var(--muted)}
.last b{color:var(--text);font-weight:600}
.sug{margin:8px 0 2px;display:flex;align-items:center;gap:8px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.22);border-radius:var(--rb);padding:8px 8px 8px 12px;font-size:14px}
.sug .t{flex:1;color:#D6CCFF}
.exNote{margin:8px 2px 0;font-size:14px;color:var(--text2);background:var(--card2);border:1px solid var(--line);border-radius:var(--rb);padding:8px 10px}
.setsHead{display:grid;grid-template-columns:30px 1fr .84fr 48px;gap:6px;margin:16px 0 6px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.set{display:grid;grid-template-columns:30px 1fr .84fr 48px;gap:6px;align-items:center;margin-bottom:6px;border-radius:12px;transition:background .2s}
.set.done{background:var(--greenBg)}
.setNo{height:48px;border-radius:var(--rb);font-weight:700;color:var(--muted);font-size:15px;position:relative}
.setNo i{position:absolute;top:7px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 6px rgba(180,76,255,.8)}
.stepper{display:flex;align-items:center;background:var(--card2);border-radius:var(--rb);height:48px;overflow:hidden;border:1px solid var(--line2)}
.stepper button{width:40px;height:100%;font-size:22px;font-weight:500;color:var(--accent2);flex:none}
.stepper button:active{background:rgba(61,123,255,.14)}
.stepper input{flex:1;min-width:0;width:100%;height:100%;text-align:center;background:transparent;border:0;font-size:18px;font-weight:700;outline:none;padding:0;font-variant-numeric:tabular-nums}
.stepper:focus-within{border-color:var(--neon);box-shadow:0 0 0 1px rgba(180,76,255,.4),0 0 16px rgba(180,76,255,.25)}
.set.done .stepper{border-color:rgba(52,211,153,.3)}
.check{height:48px;border-radius:var(--rb);background:var(--card2);border:1px solid var(--line2);font-size:22px;color:var(--muted);font-weight:800}
.set.done .check{background:var(--success);color:#04140D;border-color:var(--success)}
.setNote{font-size:12.5px;color:#D9A8FF;margin:-2px 0 6px 40px}
.skipMsg{margin-top:12px;padding:12px;border-radius:var(--rb);background:var(--card2);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ex.skipped{opacity:.72}
/* timer */
#timer{position:fixed;left:8px;right:8px;bottom:calc(var(--navH) + var(--safeB) + 8px);z-index:29;background:rgba(20,17,31,.97);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow),0 0 0 1px rgba(180,76,255,.08);transform:translateY(150%);transition:transform .25s}
#timer.show{transform:none}
#timer .tbar{height:3px;background:var(--line)}
#timer .tfill{height:100%;background:var(--grad);width:100%;transition:width .25s linear;box-shadow:0 0 10px rgba(180,76,255,.6)}
#timer .trow{display:flex;align-items:center;gap:8px;padding:8px 10px}
#timer .tval{flex:1;text-align:center;line-height:1.05}
#timer .tval small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
#timer .tval b{font-size:32px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--text);text-shadow:var(--tglow)}
#timer .tb{min-width:56px;height:48px;border-radius:var(--rb);background:var(--surface);border:1px solid var(--line2);font-weight:600;font-variant-numeric:tabular-nums}
#timer.over{border-color:rgba(52,211,153,.6)}
#timer.over .tfill{background:var(--success);box-shadow:none}
#timer.over .tval b{color:var(--success);font-size:22px;text-shadow:0 0 12px rgba(52,211,153,.45)}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end}
#sheetWrap[hidden]{display:none}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(3,2,8,.72);animation:fade .2s}
#sheetWrap .sheet{position:relative;width:100%;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 16px calc(24px + var(--safeB));animation:up .22s ease-out;border-top:1px solid var(--line2);box-shadow:0 -8px 32px rgba(0,0,0,.5)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 16px}
.sheet p{color:var(--muted);margin:0 0 16px}
.sheet .menu button{display:flex;width:100%;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-radius:var(--rb);font-size:16px;font-weight:500;text-align:left}
.sheet .menu button:active{background:var(--card2)}
.sheet .menu button.red{color:#FF7A93}
.sheet .menu .ic{width:26px;text-align:center;font-size:18px;color:var(--text2)}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.08em}
.inp{width:100%;min-height:48px;background:var(--card2);border:1px solid var(--line2);border-radius:var(--rb);padding:10px 12px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--neon);box-shadow:0 0 0 1px rgba(180,76,255,.35),0 0 16px rgba(180,76,255,.2)}
textarea.inp{min-height:80px;resize:vertical}
.plist{list-style:none;margin:0 0 16px;padding:0}
.plist li{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;min-height:52px}
.plist li .n{flex:1;font-weight:500}
.plist .icon{width:40px;height:40px;background:var(--surface);font-size:17px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pick .chip{min-height:40px;font-size:14px}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--blue)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* history */
.hist{display:block;width:100%;text-align:left}
.hist .d{font-family:var(--fHead);font-weight:700;font-size:19px;line-height:1.25}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px;color:var(--muted)}
.stats b{color:var(--text);font-weight:650}
.dEx{padding:12px 16px}
.dEx .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sets span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.sets span em{font-style:normal;color:#D9A8FF;font-size:12px;margin-left:4px}
.delta{font-size:12.5px;font-weight:650;padding:2px 8px;border-radius:7px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--success);background:var(--greenBg)}.delta.down{color:#FF7A93;background:var(--redBg)}.delta.eq{color:var(--muted);background:var(--card2)}
/* progress */
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.tile .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile:first-child .v{text-shadow:var(--tglow)}
.tile .v small{font-size:13px;color:var(--muted);font-weight:600;text-shadow:none}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:var(--rb);padding:3px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px rgba(180,76,255,.45),0 0 14px rgba(180,76,255,.18)}
svg.chart{width:100%;height:auto;display:block;font-family:var(--fUI);font-variant-numeric:tabular-nums}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
/* weight */
.bwIn{display:flex;align-items:center;gap:8px;margin:8px 0 16px}
.bwIn .stepper{flex:1;height:64px}
.bwIn .stepper input{font-size:30px;text-shadow:var(--tglow)}
.bwIn .stepper button{width:56px;font-size:26px}
.wlist .wi{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.wlist .wi:last-child{border-bottom:0}
.inband{color:var(--success)}.outband{color:var(--warning)}
.grip{color:#4A4368;font-size:15px;line-height:28px;margin:1px -3px 0 -4px;flex:none;-webkit-user-select:none;user-select:none}
[data-sort-item]{-webkit-touch-callout:none}
.exHead,.last,.sug .t,.exNote,.setsHead,.plist .n,.plist .grip{-webkit-user-select:none;user-select:none}
[data-sort-item].pressing{transform:scale(.985);transition:transform .25s ease}
.drag-ph{border:2px dashed rgba(180,76,255,.5);border-radius:var(--r);background:rgba(180,76,255,.05);list-style:none;box-sizing:border-box}
.plist .drag-ph{border-radius:12px}
.dragging{position:fixed;z-index:45;pointer-events:none;box-shadow:0 18px 40px rgba(0,0,0,.65),0 0 0 1px var(--neon),var(--glow);transform:scale(1.03);opacity:.97;transition:transform .15s ease,box-shadow .15s ease}
.plist li.dragging{background:var(--card2)}
#exList.sorting .ex>:not(.exHead){display:none}
#exList.sorting .ex{padding:10px}
#exList.sorting .ex .exHead .chip,#exList.sorting .ex .exHead .icon{visibility:hidden}
body.dragActive{-webkit-user-select:none;user-select:none;cursor:grabbing}
#toast{position:fixed;left:50%;top:calc(var(--safeT) + 14px);transform:translate(-50%,-150%);background:var(--surface2);border:1px solid var(--line2);color:var(--text);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;transition:transform .25s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.back{font-size:28px;line-height:1;width:44px;height:44px;margin-left:-10px;color:var(--accent2)}
a{color:var(--accent2)}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
</style>
</head>
<body>
<header id="top"><div id="topLeft"></div><div id="topTitle">Gym</div><div id="topRight"></div></header>
<main id="view"></main>
<div id="timer" aria-live="polite">
  <div class="tbar"><div class="tfill"></div></div>
  <div class="trow">
    <button class="tb" data-a="tAdj" data-v="-15">−15</button>
    <div class="tval"><small id="tLabel">Pause</small><b id="tTime">1:30</b></div>
    <button class="tb" data-a="tAdj" data-v="15">+15</button>
    <button class="tb" data-a="tStop" aria-label="Timer stoppen">✕</button>
  </div>
</div>
<nav id="nav">
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Training</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Verlauf</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Fortschritt</button>
  <button data-tab="bw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 9.5l1.5-2"/></svg>Gewicht</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Mehr</button>
</nav>
<div id="sheetWrap" hidden><div class="backdrop" data-a="sheetClose"></div><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json,text/plain" hidden>
<script>
'use strict';

const round = (n, d = 2) => Math.round(n * 10 ** d) / 10 ** d;
const fmtN = (n, d = 2) => (n == null || isNaN(n)) ? '–' : String(round(n, d)).replace('.', ',');
const parseN = s => { const v = parseFloat(String(s).trim().replace(',', '.')); return isNaN(v) ? null : v; };
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };

const fmtDate = (s, long) => { const d = parseISO(s); return long ? `${WD[d.getDay()]}, ${dm(s)}${d.getFullYear()}` : `${WD[d.getDay()]} ${dm(s)}`; };

let state;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { /* privat-modus */ }
  if (!raw) { state = defaultState(); save(); return; }
  try { state = normalize(JSON.parse(raw)); save(); }
  catch (e) {
    try { localStorage.setItem(KEY + '.corrupt.' + Date.now(), raw); } catch (_) {}
    state = defaultState(); save();
    setTimeout(() => toast('Gespeicherte Daten waren beschädigt – Kopie gesichert.'), 500);
  }

    bw: Array.isArray(s.bw) ? s.bw.filter(x => x && x.date && typeof x.kg === 'number') : [],
    active: s.active && Array.isArray(s.active.ex) ? s.active : null,
  };
  return migrate(out);
}
/** v1.1: Standard-Schrittweite ist jetzt 0,5 kg. Alte gespeicherte 2,5 (= alter Standard) zurücksetzen. */
function migrate(s) {
  if (!s.settings.stepV2) {
    for (const k in s.lib) if (s.lib[k] && s.lib[k].step === 2.5) delete s.lib[k].step;
    s.settings.stepV2 = true;
  }
  return s;
}
const DEFAULT_STEP = 0.5;
function save() {

const lib = name => state.lib[name] || (state.lib[name] = {});

/* ---------- Auswertung ---------- */
const sortedSessions = () => state.sessions.slice().sort((a, b) => a.date === b.date ? (a.finishedAt || 0) - (b.finishedAt || 0) : a.date < b.date ? -1 : 1);
/** Alle Einheiten (alt→neu) mit echten Sätzen für eine Übung */
function performances(name, excludeId) {
  const out = [];
  for (const s of sortedSessions()) {
    if (s.id === excludeId) continue;
    const ex = s.ex.find(e => e.name === name && !e.skipped && e.sets && e.sets.length);
    if (ex) out.push({ session: s, ex });
  }
  return out;
}
function lastMention(name, excludeId) {
  const ss = sortedSessions().filter(s => s.id !== excludeId);
  for (let i = ss.length - 1; i >= 0; i--) { const ex = ss[i].ex.find(e => e.name === name); if (ex) return { session: ss[i], ex }; }
  return null;
}
const isBW = (name, ex) => !!((ex && ex.bw != null) ? ex.bw : lib(name).bw);
const topW = sets => sets.length ? Math.max(...sets.map(s => +s.w || 0)) : 0;
const totalReps = sets => sum(sets.map(s => +s.r || 0));
const volume = sets => sum(sets.map(s => (+s.w || 0) * (+s.r || 0)));
const e1rm = sets => Math.max(0, ...sets.filter(s => s.r > 0 && s.r <= 15).map(s => s.w * (1 + s.r / 30)));
function wLabel(w, bw) {
  if (!bw) return fmtN(w);
  if (!w) return 'KG';
  return (w > 0 ? '+' : '−') + fmtN(Math.abs(w));
}
function setStr(s, bw) { return bw && !s.w ? `${s.r}` : `${wLabel(s.w, bw)}×${s.r}`; }
function setsStr(sets, bw) {
  if (bw && sets.every(s => !s.w)) return sets.map(s => s.r).join(' · ') + ' Wdh.';
  return sets.map(s => setStr(s, bw)).join(' · ') + (bw ? '' : ' kg');
}

/** Progressionsvorschlag */
function suggest(name, excludeId) {
  const perfs = performances(name, excludeId);
  if (!perfs.length) return null;
  const last = perfs[perfs.length - 1].ex.sets.filter(s => s.r > 0);
  if (!last.length) return null;
  const prev = perfs.length > 1 ? perfs[perfs.length - 2].ex.sets.filter(s => s.r > 0) : null;
  const bw = isBW(name, perfs[perfs.length - 1].ex);
  const inc = state.settings.inc || 2.5;
  const top = topW(last);
  const allHigh = last.every(s => s.r >= 12);
  let beat = false;
  if (prev && prev.length) {
    const topSets = last.filter(s => s.w === top);
    beat = top === topW(prev) && totalReps(last) > totalReps(prev) && Math.min(...topSets.map(s => s.r)) >= 10;
  }
  if (allHigh || beat) {
    const sets = last.map(s => ({ w: round(s.w + inc), r: Math.max(6, Math.min(s.r, 12) - 2) }));
    const why = allHigh ? 'alle Sätze ≥ 12 Wdh.' : 'mehr Wdh. als beim Mal davor';
    return { kind: 'weight', sets, why,
      text: `<b>+${fmtN(inc)} kg${bw ? ' Zusatz' : ''}</b> (${why}): ${setsStr(sets, bw)}` };
  }
  const sets = last.map(s => ({ w: s.w, r: s.r + 1 }));
  return { kind: 'reps', sets, why: 'gleiches Gewicht',
    text: `<b>+1 Wdh. pro Satz</b>: ${setsStr(sets, bw)}` };
}

async function finishSession() {
  const a = state.active;
  document.querySelectorAll('.stepper input[data-in]').forEach(commitInput);
  const open = a.ex.filter(e => !e.skipped).reduce((n, e) => n + e.sets.filter(s => !s.done).length, 0);
  const done = a.ex.reduce((n, e) => n + e.sets.filter(s => s.done).length, 0);
  if (!done && !a.ex.some(e => e.skipped)) { toast('Hake zuerst mindestens einen Satz mit ✓ ab'); return; }
  if (open && !(await ask(a.editingId ? 'Speichern?' : 'Training beenden?', `${open} ${open === 1 ? 'Satz ist' : 'Sätze sind'} nicht abgehakt und ${open === 1 ? 'wird' : 'werden'} nicht gespeichert.`, a.editingId ? 'Speichern' : 'Beenden'))) return;
  const sess = {
    id: a.editingId || a.id, date: a.date || todayISO(), planId: a.planId, title: (a.title || '').trim() || 'Training',
    startedAt: a.startedAt, finishedAt: a.finishedAt || Date.now(),
    ex: a.ex.map(e => {
      const L = lib(e.name);
      const o = { name: e.name, sets: e.skipped ? [] : e.sets.filter(s => s.done).map(s => { const x = { w: +s.w || 0, r: +s.r || 0 }; if (s.note) x.note = s.note; return x; }) };
      if (L.bw) o.bw = true; if (L.perSide) o.perSide = true;
      if (e.note) o.note = e.note; if (e.skipped) o.skipped = true;
      return o;
    }).filter(e => e.skipped || e.sets.length),
  };
  const idx = state.sessions.findIndex(s => s.id === sess.id);
  if (idx >= 0) state.sessions[idx] = sess; else state.sessions.push(sess);
  state.active = null; save(); stopTimer(); releaseWakeLock();
  ui.tab = 'hist'; ui.histId = sess.id; render();
  toast(a.editingId ? 'Änderungen gespeichert' : 'Training gespeichert 💪');
}

/* ----- Verlauf ----- */
function sessStats(s) {
  const ex = s.ex.filter(e => !e.skipped);
  const sets = sum(ex.map(e => e.sets.length));
  const vol = sum(ex.filter(e => !e.bw).map(e => volume(e.sets)));
  const dur = s.finishedAt && s.startedAt ? Math.round((s.finishedAt - s.startedAt) / 60000) : null;
  return `<div class="stats"><span><b>${ex.length}</b> Übungen</span><span><b>${sets}</b> Sätze</span><span><b>${fmtN(vol / 1000, 1)}</b> t Volumen</span>${dur && dur < 600 ? `<span><b>${dur}</b> min</span>` : ''}</div>`;
}
function histCardInner(s) {
  return `<div class="row between"><span class="d">${fmtDate(s.date, true)}</span><span class="muted" style="font-size:22px;line-height:1">›</span></div>
    <div class="muted small">${esc(s.title)}</div>
    <div class="small" style="margin-top:6px;color:var(--text2)">${s.ex.map(e => esc(e.name) + (e.skipped ? ' <span class="muted">(verschoben)</span>' : '')).join(' · ')}</div>
    ${sessStats(s)}`;
}
function viewHistory() {
  setHeader('Verlauf');
  const ss = sortedSessions().reverse();
  if (!ss.length) return `<div class="empty">Noch keine Trainings gespeichert.</div>`;
  let h = '', month = '';
  for (const s of ss) {
    const m = parseISO(s.date).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    if (m !== month) { h += `<h2>${m}</h2>`; month = m; }
    h += `<button class="card hist" data-a="openSess" data-id="${s.id}">${histCardInner(s)}</button>`;
  }
  return h;
}
function deltaBadge(cur, prev) {
  if (!prev) return '<span class="delta eq">Neu</span>';
  const dt = topW(cur) - topW(prev), dr = totalReps(cur) - totalReps(prev);
  if (dt > 0) return `<span class="delta up">+${fmtN(dt)} kg</span>`;
  if (dt < 0) return `<span class="delta down">−${fmtN(-dt)} kg</span>`;
  if (dr > 0) return `<span class="delta up">+${dr} Wdh.</span>`;
  if (dr < 0) return `<span class="delta down">−${-dr} Wdh.</span>`;
  return '<span class="delta eq">gleich</span>';
}
function setChip(x, bw) {
  const txt = bw && !x.w ? `${x.r} Wdh.` : `${wLabel(x.w, bw)} kg × ${x.r}`;
  return `<span>${txt}${x.note ? `<em>${esc(x.note)}</em>` : ''}</span>`;
}
function viewSessionDetail() {
  const s = state.sessions.find(x => x.id === ui.histId);
  if (!s) { ui.histId = null; return viewHistory(); }
  setHeader(fmtDate(s.date, true), `<button class="back" data-a="histBack" aria-label="Zurück">‹</button>`);
  let h = `<div class="card"><div style="font-weight:750;font-size:17px">${esc(s.title)}</div>${sessStats(s)}</div>`;
  const before = p => p.session.id !== s.id && (p.session.date < s.date || (p.session.date === s.date && (p.session.finishedAt || 0) < (s.finishedAt || 0)));
  for (const e of s.ex) {
    const prev = performances(e.name).filter(before).slice(-1)[0];
    const bw = !!e.bw;
    h += `<div class="card dEx"><div class="h"><b style="font-size:16.5px">${esc(e.name)}</b>${e.skipped ? '<span class="delta eq">verschoben</span>' : deltaBadge(e.sets, prev && prev.ex.sets)}</div>`;
    if (e.perSide || bw) h += `<div style="margin-top:4px">${bw ? '<span class="tag or">Körpergewicht + Zusatz</span>' : ''}${e.perSide ? '<span class="tag">je Seite</span>' : ''}</div>`;
    if (!e.skipped) h += `<div class="sets">${e.sets.map(x => setChip(x, bw)).join('')}</div>`;
    if (prev && !e.skipped) h += `<div class="tiny muted" style="margin-top:7px">Davor (${dm(prev.session.date)}): ${setsStr(prev.ex.sets, bw)}</div>`;
    if (e.note) h += `<div class="exNote">📝 ${esc(e.note)}</div>`;
    h += `</div>`;
  }
  h += `<button class="btn block" data-a="repeatSess" data-id="${s.id}">↻ Als neues Training wiederholen</button>
    <button class="btn block" data-a="editSess" data-id="${s.id}">✎ Bearbeiten</button>
    <button class="btn block danger" data-a="delSess" data-id="${s.id}">Löschen</button>`;
  return h;
}

/* ----- Diagramme (inline SVG, keine externen Libs) ----- */
let chartN = 0;
function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(raw)); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function lineChart(points, opt = {}) {
  if (!points.length) return '<div class="empty">Noch keine Daten</div>';
  const { unit = '', band = null, color = '#3D7BFF', decimals = 1 } = opt;
  const W = 340, H = 200, L = 40, R = 14, T = 18, B = 26, id = 'g' + (++chartN);
  const xs = points.map(p => p.t);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1) { x0 -= 3 * 864e5; x1 += 3 * 864e5; }
  let ys = points.map(p => p.y); if (band) ys = ys.concat(band);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.18 || Math.max(1, Math.abs(y1) * 0.08);
  y0 -= pad; y1 += pad; if (Math.min(...ys) >= 0 && y0 < 0) y0 = 0;
  const step = niceStep((y1 - y0) / 4);
  y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  if (band) s += `<rect x="${L}" y="${Y(band[1])}" width="${W - L - R}" height="${Y(band[0]) - Y(band[1])}" fill="rgba(52,211,153,.08)"/>
    <text x="${L + 4}" y="${Y(band[1]) + 12}" fill="#34D399" font-size="10" font-weight="700">Ziel ${fmtN(band[0])}–${fmtN(band[1])} kg</text>`;
  for (let v = y0; v <= y1 + 1e-9; v += step) {
    s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1F1A33" stroke-width="1"/>
      <text x="${L - 6}" y="${Y(v) + 3.5}" fill="#9A93C0" font-size="10" text-anchor="end">${fmtN(v, 1)}</text>`;
  }
  const pts = points.map(p => [X(p.t), Y(p.y)]);
  const lineD = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  if (pts.length > 1) {
    s += `<path d="${lineD} L${pts[pts.length - 1][0].toFixed(1)} ${Y(y0)} L${pts[0][0].toFixed(1)} ${Y(y0)} Z" fill="url(#${id})"/>`;
    s += `<path d="${lineD}" fill="none" stroke="${color}" stroke-width="2.25" style="filter:drop-shadow(0 0 6px ${color}88)" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p, i) => { const l = i === pts.length - 1; s += `<circle cx="${p[0]}" cy="${p[1]}" r="${l ? 4.5 : 3.2}" fill="${l ? color : '#050409'}" stroke="${color}" stroke-width="2"/>`; });
  const lp = pts[pts.length - 1], lv = points[points.length - 1].y;
  s += `<text x="${lp[0]}" y="${lp[1] - 10}" fill="#EDEAFF" font-size="11.5" font-weight="800" text-anchor="${lp[0] > W - 60 ? 'end' : lp[0] < L + 30 ? 'start' : 'middle'}">${fmtN(lv, decimals)}${unit}</text>`;
  const idxs = [...new Set(points.length <= 3 ? points.map((_, i) => i) : [0, Math.floor((points.length - 1) / 2), points.length - 1])];
  idxs.forEach(i => { const x = X(points[i].t);
    s += `<text x="${x}" y="${H - 8}" fill="#9A93C0" font-size="10" text-anchor="${x < L + 20 ? 'start' : x > W - R - 20 ? 'end' : 'middle'}">${dm(isoOf(new Date(points[i].t)))}</text>`; });
  return s + `</svg>`;
}

/* ----- Fortschritt ----- */
function viewProgress() {
  setHeader('Fortschritt');
  const withHist = libNames().filter(n => performances(n).length);
  const without = libNames().filter(n => !withHist.includes(n));
  if (!ui.progEx || !state.lib[ui.progEx]) ui.progEx = withHist[0] || libNames()[0];
  const name = ui.progEx; const perfs = performances(name);
  const bw = !!lib(name).bw;
  let h = `<select class="inp" data-in="progEx" style="margin-bottom:12px" aria-label="Übung">
    ${withHist.length ? `<optgroup label="Mit Verlauf">${withHist.map(n => `<option ${n === name ? 'selected' : ''}>${esc(n)}</option>`).join('')}</optgroup>` : ''}
    ${without.length ? `<optgroup label="Noch ohne Daten">${without.map(n => `<option ${n === name ? 'selected' : ''}>${esc(n)}</option>`).join('')}</optgroup>` : ''}
  </select>`;
  if (!perfs.length) return h + `<div class="card empty">Für <b>${esc(name)}</b> gibt es noch keine Einträge.<br>Sobald du sie trainierst, siehst du hier deinen Verlauf.</div>`;
  const last = perfs[perfs.length - 1].ex.sets, first = perfs[0].ex.sets;
  const best = Math.max(...perfs.map(p => topW(p.ex.sets)));
  const bestReps = Math.max(...perfs.map(p => totalReps(p.ex.sets)));
  let since = '–';
  if (perfs.length > 1) {
    const dw = topW(last) - topW(first), dr = totalReps(last) - totalReps(first);
    since = dw ? `${dw > 0 ? '+' : '−'}${fmtN(Math.abs(dw))} <small>kg</small>` : `${dr >= 0 ? '+' : '−'}${Math.abs(dr)} <small>Wdh.</small>`;
  }
  h += `<div class="tiles">
    <div class="tile"><div class="k">${bw ? 'Max. Zusatz' : 'Bestes Gewicht'}</div><div class="v">${bw && !best ? 'KG' : fmtN(best) + ' <small>kg</small>'}</div></div>
    <div class="tile"><div class="k">Einheiten</div><div class="v">${perfs.length}</div></div>
    <div class="tile"><div class="k">${bw ? 'Max. Wdh. gesamt' : 'Geschätztes 1RM'}</div><div class="v">${bw ? bestReps : fmtN(Math.max(...perfs.map(p => e1rm(p.ex.sets))), 1) + ' <small>kg</small>'}</div></div>
    <div class="tile"><div class="k">Seit erstem Log</div><div class="v">${since}</div></div>
  </div>`;
  const sug = suggest(name);
  if (sug) h += `<div class="sug" style="margin:0 0 12px"><span class="t">💡 Nächstes Mal: ${sug.text}</span></div>`;
  const metrics = bw ? [['top', 'Zusatzgewicht'], ['reps', 'Wdh. gesamt']] : [['top', 'Top-Gewicht'], ['vol', 'Volumen'], ['reps', 'Wdh. gesamt']];
  if (!metrics.some(m => m[0] === ui.progMetric)) ui.progMetric = metrics[0][0];
  const pts = perfs.map(p => ({ t: parseISO(p.session.date).getTime() + Math.min(Math.max((p.session.finishedAt || 0) - parseISO(p.session.date).getTime(), 0), 864e5 - 1), y: ui.progMetric === 'top' ? topW(p.ex.sets) : ui.progMetric === 'vol' ? volume(p.ex.sets) : totalReps(p.ex.sets) }));
  h += `<div class="card"><div class="seg">${metrics.map(m => `<button class="${m[0] === ui.progMetric ? 'on' : ''}" data-a="progMetric" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>
    ${lineChart(pts, { unit: ui.progMetric === 'reps' ? '' : ' kg', decimals: ui.progMetric === 'vol' ? 0 : 1 })}
    <div class="tiny muted" style="margin-top:4px">${ui.progMetric === 'vol' ? 'Volumen = Summe Gewicht × Wdh. aller Sätze' : ui.progMetric === 'reps' ? 'Summe der Wiederholungen aller Sätze' : 'Schwerster Satz der Einheit'}${lib(name).perSide ? ' · Gewichte je Seite' : ''}</div></div>`;
  h += `<div class="card"><table class="tbl"><thead><tr><th>Datum</th><th>Sätze</th><th class="r">${bw ? 'Wdh.' : 'Vol.'}</th><th class="r">Δ</th></tr></thead><tbody>`;
  perfs.slice().reverse().forEach((p, i, arr) => {
    const prev = arr[i + 1];
    h += `<tr><td style="white-space:nowrap">${fmtDate(p.session.date)}</td><td>${p.ex.sets.map(s => setStr(s, bw)).join(' · ')}</td>
      <td class="r">${bw ? totalReps(p.ex.sets) : fmtN(volume(p.ex.sets), 0)}</td><td class="r">${deltaBadge(p.ex.sets, prev && prev.ex.sets)}</td></tr>`;
  });
  return h + `</tbody></table></div>`;
}

/* ----- Körpergewicht ----- */
let bwDraft = null;

  return h;
}

  beep();

/* ---------- Mitteilungen (Notification API über Service Worker) ---------- */
const isStandalone = () => navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const notifSupported = () => 'Notification' in window;
const notifPerm = () => notifSupported() ? Notification.permission : 'unsupported';
async function askNotifPermission() {
  state.settings.notifAsked = true; save();
  if (!notifSupported()) {
    toast(isIOS() && !isStandalone() ? 'Nur in der App vom Home-Bildschirm möglich' : 'Mitteilungen werden hier nicht unterstützt');
    return 'unsupported';
  }
  let p;
  try { p = await Notification.requestPermission(); } catch (e) { p = Notification.permission; }
  if (p === 'granted') { state.settings.notify = true; save(); toast('Mitteilungen aktiviert ✓'); }
  else if (p === 'denied') toast('Mitteilungen blockiert – in den iPhone-Einstellungen änderbar');
  return p;
}
async function showRestNotification(body, title = 'Pause vorbei 💪') {
  if (!state.settings.notify || notifPerm() !== 'granted') return false;
  const opts = { body: body || 'Weiter geht’s!', tag: 'gym-rest', renotify: true, silent: false, vibrate: [300, 120, 300], data: { url: location.href.split('#')[0] } };
  try {
    if ('serviceWorker' in navigator) {
      const reg = await Promise.race([navigator.serviceWorker.getRegistration(), new Promise(r => setTimeout(() => r(null), 1500))]);
      if (reg && reg.showNotification) { await reg.showNotification(title, opts); return true; }
    }
  } catch (e) {}
  try { new Notification(title, opts); return true; } catch (e) { return false; }   // Fallback (z. B. ohne Service Worker)
}

/* ---------- Optional: echte Hintergrund-Mitteilung über ntfy.sh (kein Konto, Thema = Zufallsgeheimnis auf dem Gerät) ---------- */
const NTFY = 'https://ntfy.sh';
const hdrEnc = s => /^[\x20-\x7e]*$/.test(s) ? s : '=?UTF-8?B?' + btoa(String.fromCharCode(...new TextEncoder().encode(s))) + '?=';
function newTopic() { const a = new Uint8Array(15); crypto.getRandomValues(a); return 'gym-' + [...a].map(b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); }
function ntfyPost(path, body, headers) {
  return fetch(`${NTFY}/${state.settings.ntfyTopic}${path}`, { method: 'POST', body, headers, keepalive: true });
}
async function ntfySchedule() {
  const S = state.settings;
  if (!S.ntfy || !S.ntfyTopic || !T.end) return;
  if (pushActive()) { ntfyCancel(); return; }                   // v1.2: echter Push ist aktiv → ntfy nicht doppelt
  const secs = Math.round((T.end - Date.now()) / 1000);
  if (secs < 11) { ntfyCancel(); return; }                      // ntfy.sh: Mindestverzögerung 10 s
  const at = T.end;
  T.ntfy = 'pending'; T.ntfyAt = at; persistTimer();
  try {
    // gleiche Sequenz-ID "rest" → ersetzt eine noch nicht zugestellte, vorher geplante Mitteilung
    const r = await ntfyPost('/rest', T.body || 'Weiter geht’s!', { 'X-Delay': secs + 's', 'X-Title': hdrEnc('Pause vorbei 💪'), 'X-Tags': 'stopwatch', 'X-Priority': '4' });
    if (T.ntfyAt === at && T.ntfy === 'pending') T.ntfy = r.ok ? 'scheduled' : 'error';
  } catch (e) { if (T.ntfyAt === at) T.ntfy = 'error'; }
  persistTimer();
}
function ntfyCancel() {
  const S = state.settings;
  // nur stornieren, solange sie noch nicht zugestellt wurde (DELETE danach würde die zugestellte Mitteilung entfernen)
  if (!T.ntfy || T.ntfy === 'cancelled' || !S.ntfyTopic || Date.now() > T.ntfyAt - 500) return;
  T.ntfy = 'cancelled'; persistTimer();
  try { fetch(`${NTFY}/${S.ntfyTopic}/rest`, { method: 'DELETE', keepalive: true }).catch(() => {}); } catch (e) {}
}

let wakeLock = null;

}

/* ---------- Export / Import ---------- */

  const a = document.createElement('a'); a.href = url; a.download = backupName(); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);

  setInc: el => { state.settings.inc = +el.dataset.v; save(); render(true); },
  export: () => doExport(), shareExport: () => doShare(),
  import: () => { const f = $('#fileIn'); f.value = ''; f.click(); },
  resetPlans: async () => { if (!(await ask('Pläne zurücksetzen?', 'Die 4 Trainingstage bekommen wieder die Standard-Übungen. Dein Verlauf bleibt erhalten.', 'Zurücksetzen', true))) return; state.plans = clone(DEFAULT_PLANS); for (const k in DEFAULT_LIB) if (!state.lib[k]) state.lib[k] = clone(DEFAULT_LIB[k]); save(); render(true); toast('Pläne zurückgesetzt'); },
  wipe: async () => {
    if (!(await ask('Alle Daten löschen?', 'Alle Trainings, Gewichte und Pläne werden gelöscht. Exportiere vorher ein Backup!', 'Alles löschen', true))) return;
    state = defaultState(); state.sessions = []; state.bw = []; save(); stopTimer(); ui.histId = null; render(); toast('Alle Daten gelöscht');
  },
};
function keepPlanTitle() { const t = $('#pTitle'); if (t && planDraft) planDraft.title = t.value.trim() || planDraft.title; }
function moveEx(id, d) {
  const a = state.active.ex, i = a.findIndex(e => e.id === id), j = i + d;
  if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; save(); closeSheet(); render(true);
  setTimeout(() => { const el = $('#ex-' + id); el && el.scrollIntoView({ block: 'center' }); }, 30);
}
function adjust(el, dir) {
  const { ex, set, row } = ctx(el); const f = el.dataset.f; const L = lib(ex.name);
  const inp = row.querySelector(`[data-in=${f}]`); commitInput(inp);
  if (f === 'w') set.w = round(Math.max(L.bw ? -100 : 0, (+set.w || 0) + dir * (L.step || DEFAULT_STEP)));
  else set.r = Math.max(0, (+set.r || 0) + dir);
  inp.value = f === 'w' ? fmtN(set.w) : set.r; save();
}
function commitInput(inp) {
  if (!inp || !inp.dataset || !/^[wr]$/.test(inp.dataset.in || '')) return;
  const { ex, set } = ctx(inp); if (!set) return;
  const v = parseN(inp.value);
  if (inp.dataset.in === 'w') { if (v != null) set.w = round(Math.max(lib(ex.name).bw ? -100 : 0, v)); inp.value = fmtN(set.w); }
  else { if (v != null) set.r = Math.max(0, Math.round(v)); inp.value = set.r; }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('#nav [data-tab]');
  if (tab) {
    const same = ui.tab === tab.dataset.tab; ui.tab = tab.dataset.tab;
    if (ui.tab === 'hist' && same) ui.histId = null;
    if (ui.tab === 'bw') bwDraft = null;
    render(); return;
  }
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'w' || k === 'r') { commitInput(el); save(); }
  else if (k === 'sessTitle') { state.active.title = el.value; save(); }
  else if (k === 'sessDate') { if (el.value) state.active.date = el.value; save(); }
  else if (k === 'progEx') { ui.progEx = el.value; render(true); }
  else if (k === 'bwDate') { bwDraft.date = el.value; }
  else if (k === 'bwKg') { const v = parseN(el.value); if (v != null) bwDraft.kg = v; }
  else if (k === 'bandLo' || k === 'bandHi') {
    const v = parseN(el.value); const S = state.settings;
    if (v != null) { S[k] = v; if (S.bandLo > S.bandHi) [S.bandLo, S.bandHi] = [S.bandHi, S.bandLo]; save(); }
    render(true);
  }
  else if (k.startsWith('set_')) { state.settings[k.slice(4)] = el.checked; save(); if (k === 'set_wakeLock') el.checked ? requestWakeLock() : releaseWakeLock(); if (k === 'set_ntfy') { if (el.checked) ntfySchedule(); else ntfyCancel(); } if (k === 'set_notify' && !el.checked) pushCancel(); }
});
document.addEventListener('focusin', e => { if (e.target.matches('.stepper input:not([readonly])')) setTimeout(() => { try { e.target.select(); } catch (_) {} }, 0); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.matches('.stepper input')) t.blur();
  else if (t.id === 'axNew') A.axAddNew();
  else if (t.id === 'pNew') A.pAddNew();
  else if (t.id === 'askIn' && t.tagName === 'INPUT') A.sheetOk();
});
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  importText(await f.text());
});
window.addEventListener('storage', e => { if (e.key === KEY) { load(); render(true); } });

/* ---------- PWA: Manifest + Offline ---------- */
(function pwa() {
  try {
    const base = location.href.split('#')[0].split('?')[0];
    const manifest = { name: 'Gym Tracker', short_name: 'Gym', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone',
      background_color: '#050409', theme_color: '#050409', lang: 'de',
      icons: [{ src: ICON, sizes: '180x180', type: 'image/png', purpose: 'any' }] };
    const link = document.createElement('link'); link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  } catch (e) {}
  // Optionaler Service Worker (sw.js neben index.html): macht die App beim Hosting voll offline-fähig.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    let hadController = !!navigator.serviceWorker.controller, pendingReload = false;
    const reloadNow = () => { if (!window.__gymReloading) { window.__gymReloading = true; persistTimer(); location.reload(); } };
    // Neue Version aktiv → neu laden (Daten liegen in localStorage, nichts geht verloren)
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) { hadController = true; return; }
      const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if (typing || !$('#sheetWrap').hidden) pendingReload = true; else reloadNow();
    });
    document.addEventListener('visibilitychange', () => { if (pendingReload && document.visibilityState === 'hidden') reloadNow(); });
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {}));
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();

/* ---------- Start ---------- */
load();
if (state.active) ui.tab = 'train';
render();
restoreTimer();
requestWakeLock();
window.__gym = { get state() { return state; }, ui, suggest, performances, T, startTimer, nextSetText };

/* ---------- Sortieren per Gedrückthalten & Ziehen (Touch + Maus) ---------- */
// Gilt für alle Listen mit [data-sort-list] und Einträgen [data-sort-item]:
//  - "session": Übungen im laufenden Training  - "plan": Übungen im Trainingstag-Editor
// Normales Scrollen bleibt unberührt: Erst nach ~380 ms ruhigem Halten wird gezogen,
// wer vorher den Finger bewegt (> 10 px), scrollt ganz normal.
const DRAG = { t: null, pressT: null, item: null, list: null, active: false, ph: null, x: 0, y: 0, sx: 0, sy: 0, dy: 0, from: -1, raf: 0, lastTouch: 0, suppressUntil: 0, scroller: null };
const DRAG_DELAY = 380, DRAG_SLOP = 10;
const DRAG_NOSTART = 'input,textarea,select,button,a,label,.stepper,.check';

const dragItems = list => [...list.children].filter(el => el.hasAttribute('data-sort-item'));
function dragScroller(list) { return list.closest('.sheet') || null; }   // null = Fenster
function dragScrollBy(sc, dy) { if (!dy) return; if (sc) sc.scrollTop += dy; else window.scrollBy(0, dy); }
function dragBounds(sc) {
  if (sc) { const r = sc.getBoundingClientRect(); return { top: r.top + 60, bottom: r.bottom - 60 }; }
  const head = $('#top').getBoundingClientRect().bottom, nav = $('#nav').getBoundingClientRect().top;
  return { top: head + 60, bottom: nav - 60 };
}

function dragStart(target, x, y, input) {
  if (DRAG.active) return;
  dragCancelPress();
  const item = target && target.closest && target.closest('[data-sort-item]');
  if (!item || target.closest(DRAG_NOSTART)) return;
  const list = item.closest('[data-sort-list]'); if (!list || dragItems(list).length < 2) return;
  Object.assign(DRAG, { item, list, sx: x, sy: y, x, y, input });
  DRAG.pressT = setTimeout(() => item.classList.add('pressing'), 140);
  DRAG.t = setTimeout(dragActivate, DRAG_DELAY);
}
function dragCancelPress() {
  clearTimeout(DRAG.t); clearTimeout(DRAG.pressT); DRAG.t = DRAG.pressT = null;
  if (DRAG.item && !DRAG.active) { DRAG.item.classList.remove('pressing'); DRAG.item = null; DRAG.input = null; }
}
function dragActivate() {
  DRAG.t = null;
  const { item, list } = DRAG;
  if (!item || !item.isConnected) { dragCancelPress(); return; }
  item.classList.remove('pressing');
  DRAG.active = true; DRAG.suppressUntil = Infinity;
  try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  try { window.getSelection && window.getSelection().removeAllRanges(); } catch (e) {}
  DRAG.from = dragItems(list).indexOf(item);
  DRAG.scroller = dragScroller(list);
  list.classList.add('sorting'); document.body.classList.add('dragActive');
  // Kompaktansicht: gezogenen Eintrag unter den Finger scrollen
  let r = item.getBoundingClientRect();
  dragScrollBy(DRAG.scroller, Math.round(r.top + r.height / 2 - DRAG.y));
  r = item.getBoundingClientRect();
  const ph = document.createElement(item.tagName === 'LI' ? 'li' : 'div');
  ph.className = 'drag-ph'; ph.style.height = r.height + 'px'; ph.style.marginBottom = getComputedStyle(item).marginBottom;
  list.insertBefore(ph, item);
  DRAG.ph = ph; DRAG.dy = Math.min(Math.max(DRAG.y - r.top, 10), r.height - 10);
  Object.assign(item.style, { position: 'fixed', left: r.left + 'px', top: (DRAG.y - DRAG.dy) + 'px', width: r.width + 'px', height: r.height + 'px', margin: '0' });
  item.classList.add('dragging');
  dragLoop();
}
function dragMove(x, y) {
  DRAG.x = x; DRAG.y = y;
  if (!DRAG.active) {
    if (DRAG.t && Math.hypot(x - DRAG.sx, y - DRAG.sy) > DRAG_SLOP) dragCancelPress();   // = Scrollen
    return;
  }
  DRAG.item.style.top = (y - DRAG.dy) + 'px';
  dragReorder();
}
function dragReorder() {
  const { list, ph, item, y } = DRAG;
  const others = dragItems(list).filter(el => el !== item);
  let before = null;
  for (const el of others) { const r = el.getBoundingClientRect(); if (y < r.top + r.height / 2) { before = el; break; } }
  let next = ph.nextElementSibling; if (next === item) next = next.nextElementSibling;
  if (next !== before) list.insertBefore(ph, before);   // before = null → ans Ende
}
function dragLoop() {
  if (!DRAG.active) return;
  const b = dragBounds(DRAG.scroller); let v = 0;
  if (DRAG.y < b.top) v = -Math.min(16, (b.top - DRAG.y) / 3 + 2);
  else if (DRAG.y > b.bottom) v = Math.min(16, (DRAG.y - b.bottom) / 3 + 2);
  if (v) { dragScrollBy(DRAG.scroller, Math.round(v)); dragReorder(); }
  DRAG.raf = requestAnimationFrame(dragLoop);
}
function dragEnd() {
  if (!DRAG.active) { dragCancelPress(); return; }
  cancelAnimationFrame(DRAG.raf);
  const { item, ph, list, from } = DRAG;
  const keepTop = item.getBoundingClientRect().top;
  ph.replaceWith(item);
  item.removeAttribute('style'); item.classList.remove('dragging');
  list.classList.remove('sorting'); document.body.classList.remove('dragActive');
  DRAG.active = false; DRAG.item = null; DRAG.ph = null; DRAG.input = null;
  DRAG.suppressUntil = Date.now() + 400; DRAG.suppressOnce = true;   // nur den einen Klick, den das Loslassen evtl. erzeugt
  const to = dragItems(list).indexOf(item);
  onSortDrop(list.dataset.sortList, list, item, from, to, keepTop);
}
function onSortDrop(kind, list, item, from, to, keepTop) {
  if (kind === 'session' && state.active) {
    if (from !== to) {
      const ids = dragItems(list).map(el => el.dataset.ex);
      state.active.ex.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      toast(`${findEx(item.dataset.ex).name} verschoben`);
    }
    state.settings.dragHintSeen = true; save();
    render(true);
    const el = $('#ex-' + item.dataset.ex);
    if (el) window.scrollBy(0, el.getBoundingClientRect().top - Math.max(keepTop, $('#top').getBoundingClientRect().bottom + 8));
  } else if (kind === 'plan' && planDraft) {
    keepPlanTitle();
    planDraft.ex = dragItems(list).map(li => li.dataset.n);
    const sc = $('#sheet'), st = sc.scrollTop; refreshSheet(); sc.scrollTop = st;
  }
}

// Touch (iPhone): touchmove muss nicht-passiv sein, damit preventDefault() das Scrollen während des Ziehens stoppt.
document.addEventListener('touchstart', e => {
  DRAG.lastTouch = Date.now();
  if (e.touches.length !== 1) { if (DRAG.active) dragEnd(); else dragCancelPress(); return; }
  const t = e.touches[0]; dragStart(e.target, t.clientX, t.clientY, 'touch');
}, { passive: true });
document.addEventListener('touchmove', e => {
  const t = e.touches[0]; if (!t) return;
  if (DRAG.input !== 'touch') return;
  if (DRAG.active) { e.preventDefault(); dragMove(t.clientX, t.clientY); }
  else if (DRAG.t) dragMove(t.clientX, t.clientY);
}, { passive: false });
document.addEventListener('touchend', e => { DRAG.lastTouch = Date.now(); if (DRAG.input !== 'touch') return; if (DRAG.active && e.cancelable) e.preventDefault(); dragEnd(); }, { passive: false });
document.addEventListener('touchcancel', () => { if (DRAG.input === 'touch') dragEnd(); });
// Maus (Desktop) – emulierte Mausereignisse nach Touch ignorieren
document.addEventListener('mousedown', e => { if (e.button === 0 && !DRAG.active && Date.now() - DRAG.lastTouch > 1000) dragStart(e.target, e.clientX, e.clientY, 'mouse'); });
document.addEventListener('mousemove', e => { if (DRAG.input !== 'mouse') return; if (DRAG.active) e.preventDefault(); if (DRAG.active || DRAG.t) dragMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', () => { if (DRAG.input === 'mouse') dragEnd(); });
// Nach dem Ablegen keinen versehentlichen Klick auslösen; kein Kontextmenü/Textauswahl beim Halten
document.addEventListener('click', e => {
  if (DRAG.active || (DRAG.suppressOnce && Date.now() < DRAG.suppressUntil)) { DRAG.suppressOnce = false; e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener('contextmenu', e => { if (DRAG.t || DRAG.active) e.preventDefault(); });
document.addEventListener('selectstart', e => { if (DRAG.t || DRAG.active) e.preventDefault(); });
window.addEventListener('blur', () => { if (DRAG.active) dragEnd(); else dragCancelPress(); });

/* ---------- v1.2: Sync & Push – Aktionen und Start ---------- */
Object.assign(A, {
  syncClaimBtn: async el => {
    el.disabled = true; el.textContent = 'Verbinde …';
    await syncClaim(); if (ui.tab === 'more') render(true);
  },
  syncCodeAsk: async () => {
    const code = await askText('Kopplungscode vom verbundenen Gerät', '', 'z. B. K7QM-2XRA', false, 'Verbinden');
    if (!code) return;
    if (await syncRedeem(code)) { if (ui.tab === 'more') render(true); }
  },
  syncPairNew: async () => {
    let r; try { r = await syncApi('/v1/pair/create'); } catch (e) { toast('Keine Verbindung zum Sync-Server'); return; }
    if (!r.ok) { toast('Code konnte nicht erzeugt werden (' + r.status + ')'); return; }
    const until = new Date(r.j.expiresAt).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    openSheet(() => `<h3>Weiteres Gerät koppeln</h3>
      <p>Auf dem neuen Gerät die Gym-App öffnen → <b>Mehr → Sync & Dashboard → Kopplungscode eingeben</b>:</p>
      <div style="font-size:34px;font-weight:700;letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0 6px;text-shadow:var(--tglow)">${esc(r.j.code)}</div>
      <p class="small" style="text-align:center">Gültig bis ${until} Uhr · nur einmal verwendbar</p>
      <button class="btn block" data-a="sheetClose">Fertig</button>`);
  },
  syncNowBtn: async el => {
    el.disabled = true; const r = await syncNow({ force: true }); el.disabled = false;
    toast({ ok: 'Synchronisiert ✓', offline: 'Offline – wird nachgeholt', conflict: 'Bitte auswählen, welche Daten gelten', auth: 'Sync-Schlüssel ungültig', busy: 'Läuft schon …' }[r] || 'Sync fehlgeschlagen – wird später erneut versucht');
    syncRefreshStatus();
  },
  syncRestore: async () => {
    let rec; try { rec = await syncPull(); } catch (e) { toast(e.message || 'Keine Verbindung'); return; }
    if (!rec) { toast('Auf dem Server sind noch keine Daten'); return; }
    if (!(await ask('Daten vom Server laden?', `Server: <b>${(rec.data.sessions || []).length}</b> Trainings, Stand <b>${fmtStamp(rec.updatedAt)}</b>. Die Daten auf diesem Gerät werden ersetzt.`, 'Laden', true))) return;
    syncAdopt(rec); stopTimer(); ui.histId = null; render(true); toast('Server-Daten geladen ✓');
  },
  syncOff: async () => {
    if (!(await ask('Sync trennen?', 'Deine Daten bleiben auf diesem Gerät. Es wird nichts mehr hochgeladen, und Push bei gesperrtem Handy geht nicht mehr.', 'Trennen', true))) return;
    await pushDisable(); const c = syncCfg(); Object.assign(c, { parked: c.key, key: null, rev: null, hash: null, lastOk: null, lastErr: null, pending: false }); syncSaveCfg();
    render(true); toast('Sync getrennt');
  },
  syncUseServer: async () => {
    let rec; try { rec = await syncPull(); } catch (e) { toast(e.message || 'Keine Verbindung'); return; }
    syncConflictOpen = false; closeSheet();
    if (rec) { syncAdopt(rec); stopTimer(); ui.histId = null; render(true); toast('Server-Daten geladen ✓'); } else syncNow({ force: true });
  },
  syncUseLocal: async () => { syncConflictOpen = false; closeSheet(); const r = await syncNow({ force: true }); toast(r === 'ok' ? 'Hochgeladen ✓' : 'Hochladen fehlgeschlagen'); if (ui.tab === 'more') render(true); },
  syncLater: () => { syncConflictOpen = false; closeSheet(); },
  pushOn: async el => { el.disabled = true; await pushEnable(); render(true); },
  pushOff: async () => { await pushDisable(); render(true); toast('Push ausgeschaltet'); },
  pushTest: async () => {
    try { const r = await syncApi('/v1/push/test', { delay: 10 }); toast(r.ok ? 'Test-Push kommt in 10 s – jetzt Handy sperren' : 'Senden fehlgeschlagen (' + r.status + ')'); }
    catch (e) { toast('Keine Verbindung zum Sync-Server'); }
  },
});

/* Alte Kopplungslinks (#sync=…) aus v1.2 werden nicht mehr verwendet – Link-Inhalt sofort aus der Adresszeile entfernen */
function dropOldPairLink() {
  if (!/#sync=/.test(location.hash)) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
  toast('Kopplungslinks gibt es nicht mehr – in der App: Mehr → Sync & Dashboard → Verbinden');
}
dropOldPairLink();
window.addEventListener('hashchange', dropOldPairLink);

/* Automatischer Abgleich: beim Öffnen, wenn wieder online, beim Wegwechseln (sofort) */
setTimeout(() => { if (syncOn()) syncNow(); pushRefresh(); }, 1200);
window.addEventListener('online', () => { if (syncOn()) syncNow(); });
document.addEventListener('visibilitychange', () => {
  if (!syncOn()) return;
  if (document.visibilityState === 'hidden') { if (syncT) syncNow({ keepalive: true }); }
  else { syncNow(); pushRefresh(); }
});
window.__gym.sync = { syncCfg, syncNow, syncPair, syncClaim, syncRedeem, genKey, pushEnable, pushSchedule, pushActive, get SYNC() { return SYNC; } };
